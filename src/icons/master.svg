  <ellipse cx="72" cy="125" rx="30" ry="12" transform="rotate(24 72 125)" fill="#FDEFD6"/>
  <ellipse cx="76" cy="127" rx="19" ry="5.500" transform="rotate(24 76 127)" fill="#E2B386"/>
  <ellipse cx="184" cy="128" rx="31" ry="13" transform="rotate(-24 184 128)" fill="#E0BD88"/>
  <ellipse cx="184" cy="125" rx="30" ry="12" transform="rotate(-24 184 125)" fill="#F4E0BD"/>
  <ellipse cx="180" cy="127" rx="19" ry="5.500" transform="rotate(-24 180 127)" fill="#D9A777"/>
