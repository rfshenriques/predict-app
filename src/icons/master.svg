  <ellipse cx="122" cy="179" rx="10" ry="5" fill="#FBEBCF" opacity=".9"/>
  <path d="M119 180Q128 187 137 180" fill="none" stroke="#3A0A14" stroke-width="6" stroke-linecap="round"/>
  <path d="M117 195Q128 202 141 192" fill="none" stroke="#731328" stroke-width="4.500" stroke-linecap="round"/>
  <path d="M141 192l3-3" stroke="#731328" stroke-width="3.500" stroke-linecap="round"/>
