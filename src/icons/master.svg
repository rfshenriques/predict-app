    <path d="M150 70C186 96 182 170 128 214L200 214L200 70Z" fill="#E7C796" opacity=".55"/>
    <ellipse cx="110" cy="96" rx="22" ry="12" transform="rotate(-18 110 96)" fill="#FFFBF3" opacity=".9"/>
