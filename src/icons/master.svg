    <radialGradient id="glow" cx=".3" cy=".22" r=".7"><stop offset="0" stop-color="#C23A5E" stop-opacity=".55"/><stop offset="1" stop-color="#C23A5E" stop-opacity="0"/></radialGradient>
    <linearGradient id="horn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFDC5C"/><stop offset=".55" stop-color="#FEC40B"/><stop offset="1" stop-color="#D99500"/></linearGradient>
    <linearGradient id="face" x1=".2" y1="0" x2=".8" y2="1"><stop offset="0" stop-color="#FFF8EA"/><stop offset=".5" stop-color="#FDEFD6"/><stop offset="1" stop-color="#EFD3A4"/></linearGradient>
    <linearGradient id="muz" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F5DDB5"/><stop offset="1" stop-color="#E3BF89"/></linearGradient>
    <linearGradient id="beard" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF6E6"/><stop offset="1" stop-color="#E6C796"/></linearGradient>
    <clipPath id="head"><path d="M128 76C162 76 176 100 172 130C168 162 152 200 128 208C104 200 88 162 84 130C80 100 94 76 128 76Z"/></clipPath>
