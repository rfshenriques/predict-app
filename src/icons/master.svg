  <path d="M106 192Q112 226 128 240Q144 226 150 192Z" fill="url(#beard)"/>
  <path d="M128 206Q130 222 128 232M118 204Q120 218 124 228M138 204Q137 218 133 228" fill="none" stroke="#D9B47E" stroke-width="2.500" stroke-linecap="round"/>
