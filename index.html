<style>
/* Propline. Native iOS neutrals. Roles: burgundy = interactive + the key number, butter yellow = attention. Layout: iOS large title, floating glass tab bar, floating sheets. */
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Segoe UI",Roboto,sans-serif;
  --round:var(--font);
  --bg:#F2F2F7; --bg-rgb:242,242,247; --card:#FFFFFF; --sheet:#F2F2F7; --inset:#FFFFFF;
  --label:#1C1C1E; --label2:rgba(60,60,67,.66); --sep:rgba(60,60,67,.18); --fill:rgba(120,120,128,.12); --sw-off:rgba(120,120,128,.3);
  --tint:#731328; --tint-bg:rgba(115,19,40,.09);
  --attn:#7A5200; --attn-fill:#FEC40B; --attn-bg:rgba(254,196,11,.28);
  --red:#C5221F; --red-bg:rgba(255,59,48,.12); --green:#34C759;
  --scrim:rgba(0,0,0,.46); --seg-on:#FFFFFF;
  --lg-tint:rgba(255,255,255,.62); --lg-edge2:rgba(60,60,67,.16); --lg-rim:#fff; --lg-rim2:rgba(60,60,67,.2);
  --lg-act:rgba(120,120,128,.16); --lg-ink:rgba(28,28,30,.82); --lg-sh:rgba(0,0,0,.18); --lg-spec:rgba(255,255,255,.5); --lg-flash:rgba(255,255,255,.85);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#000000; --bg-rgb:0,0,0; --card:#1C1C1E; --sheet:#1C1C1E; --inset:#2C2C2E;
  --label:#FFFFFF; --label2:rgba(235,235,245,.64); --sep:rgba(84,84,88,.6); --fill:rgba(120,120,128,.24); --sw-off:rgba(120,120,128,.42);
  --tint:#FF8FA6; --tint-bg:rgba(255,143,166,.16);
  --attn:#FEC40B; --attn-fill:#FEC40B; --attn-bg:rgba(254,196,11,.2);
  --red:#FF6961; --red-bg:rgba(255,69,58,.2); --green:#30D158;
  --scrim:rgba(0,0,0,.58); --seg-on:#636366;
  --lg-tint:rgba(44,44,46,.68); --lg-edge2:rgba(255,255,255,.1); --lg-rim:rgba(255,255,255,.16); --lg-rim2:rgba(255,255,255,.05);
  --lg-act:rgba(255,255,255,.14); --lg-ink:rgba(255,255,255,.9); --lg-sh:rgba(0,0,0,.5); --lg-spec:rgba(255,255,255,.06); --lg-flash:rgba(255,255,255,.22);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#000000; --bg-rgb:0,0,0; --card:#1C1C1E; --sheet:#1C1C1E; --inset:#2C2C2E;
  --label:#FFFFFF; --label2:rgba(235,235,245,.64); --sep:rgba(84,84,88,.6); --fill:rgba(120,120,128,.24); --sw-off:rgba(120,120,128,.42);
  --tint:#FF8FA6; --tint-bg:rgba(255,143,166,.16);
  --attn:#FEC40B; --attn-fill:#FEC40B; --attn-bg:rgba(254,196,11,.2);
  --red:#FF6961; --red-bg:rgba(255,69,58,.2); --green:#30D158;
  --scrim:rgba(0,0,0,.58); --seg-on:#636366;
  --lg-tint:rgba(44,44,46,.68); --lg-edge2:rgba(255,255,255,.1); --lg-rim:rgba(255,255,255,.16); --lg-rim2:rgba(255,255,255,.05);
  --lg-act:rgba(255,255,255,.14); --lg-ink:rgba(255,255,255,.9); --lg-sh:rgba(0,0,0,.5); --lg-spec:rgba(255,255,255,.06); --lg-flash:rgba(255,255,255,.22);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;touch-action:manipulation;background:var(--bg)}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--label);font:1.0625rem/1.3 var(--font);-webkit-font-smoothing:antialiased;
  padding-bottom:calc(7rem + env(safe-area-inset-bottom));overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
button:focus-visible{outline:2px solid var(--tint);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
svg.ic{width:1.5rem;height:1.5rem;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* page */
.view{max-width:36rem;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);
  padding:calc(env(safe-area-inset-top) + 3.75rem) calc(1rem + env(safe-area-inset-right)) 1rem calc(1rem + env(safe-area-inset-left));
  display:flex;flex-direction:column;gap:1.25rem}
#view,#nav{transition:transform .5s cubic-bezier(.32,.72,0,1);transform-origin:50% var(--sy,0px)}
body.sheet-open #view,body.sheet-open #nav{transform:scale(var(--pscale,.95))}
.lt-wrap{display:flex;flex-direction:column;gap:.2rem;padding:0 .25rem}
.eyebrow{font-size:.8125rem;font-weight:700;color:var(--tint);text-transform:uppercase;letter-spacing:.06em}
.lt{font:700 2.125rem/1.08 var(--round);margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{font-size:.9375rem;color:var(--label2)}
.sec{font-size:.8125rem;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.04em;padding:0 1rem;margin-bottom:-.75rem}
.note{font-size:.8125rem;line-height:1.4;color:var(--label2);padding:0 1rem;margin:0}
.card{background:var(--card);border-radius:1.375rem;overflow:hidden;box-shadow:0 0 0 .5px var(--sep)}

/* top area */
#nav{position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none}
.nav-bg{position:absolute;inset:0 0 -1rem 0;background:linear-gradient(rgba(var(--bg-rgb),.72),rgba(var(--bg-rgb),0))}
.nav-bg::before{content:"";position:absolute;inset:0;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);-webkit-mask:linear-gradient(#000 40%,transparent);mask:linear-gradient(#000 40%,transparent)}
.nav-row{position:relative;max-width:36rem;margin:0 auto;display:flex;align-items:center;gap:.5rem;height:3.25rem;
  padding:0 calc(1rem + env(safe-area-inset-right)) 0 calc(1rem + env(safe-area-inset-left));margin-top:env(safe-area-inset-top)}
.nb-sp{width:2.75rem;flex:none}
.nav-title{flex:1;text-align:center;font-weight:600;opacity:0;transform:translateY(.35rem);transition:opacity .2s,transform .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nav.show-title .nav-title{opacity:1;transform:none}
.glassbtn{pointer-events:auto;flex:none;width:2.75rem;height:2.75rem;border-radius:50%;display:grid;place-items:center;color:var(--lg-ink);
  background:var(--lg-tint);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  box-shadow:inset .5px .5px 0 0 var(--lg-rim),inset -.5px -.5px 0 0 var(--lg-rim2),inset 0 0 0 .5px var(--lg-edge2),0 4px 14px var(--lg-sh);transition:transform .2s}
.glassbtn:active{transform:scale(.92)}

/* tab bar */
#tabbar{position:fixed;z-index:6;left:50%;bottom:1rem;transform:translateX(-50%);width:min(calc(100% - 2rem),36rem);height:4rem;padding:.25rem;border-radius:999px;display:flex;
  background:var(--lg-tint);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  box-shadow:inset .5px .5px 0 0 var(--lg-rim),inset -.5px -.5px 0 0 var(--lg-rim2),inset 0 0 0 .5px var(--lg-edge2),0 6px 20px var(--lg-sh);
  transition:width .45s cubic-bezier(.32,.72,0,1),height .45s cubic-bezier(.32,.72,0,1)}
#tabbar::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(120% 90% at 20% 0,var(--lg-spec),transparent 60%);opacity:.5;pointer-events:none}
#tabbar::after{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--lg-flash);opacity:0;pointer-events:none}
#tabbar button{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;color:var(--lg-ink);border-radius:999px;min-width:0}
#tabbar button span{font-size:.6875rem;font-weight:600;max-height:1rem;overflow:hidden;transition:max-height .3s,opacity .3s}
#tabbar button[aria-current="page"]{color:var(--tint)}
#tabbar svg.ic{transition:width .3s,height .3s}
.tb-ind{position:absolute;top:.25rem;bottom:.25rem;left:.25rem;width:calc((100% - .5rem)/var(--n));border-radius:999px;background:var(--lg-act);
  transform:translateX(calc(100%*var(--i,0)));transition:transform .55s cubic-bezier(.3,1.25,.4,1)}
#tabbar.min{width:min(calc(100% - 6rem),calc(4.5rem*var(--n) + .5rem));height:3rem}
#tabbar.min button span{max-height:0;opacity:0}
#tabbar.min svg.ic{width:1.4rem;height:1.4rem}
#tabbar.tap{animation:tbzoom .65s ease}
#tabbar.tap::after{animation:tbflash .65s ease}
@keyframes tbzoom{0%,100%{transform:translateX(-50%) scale(1)}35%{transform:translateX(-50%) scale(1.018)}}
@keyframes tbflash{0%,100%{opacity:0}30%{opacity:.28}}

/* hero */
.hero{display:grid;grid-template-columns:1fr auto;align-items:end;gap:.2rem 1rem;width:100%;padding:1rem 1.125rem;border-radius:1.375rem;background:var(--card);box-shadow:0 0 0 .5px var(--sep);transition:background .15s}
.hero:active{background:var(--fill)}
.hero-k{grid-column:1/-1;font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--tint)}
.hero-n{font-size:1.375rem;font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.hero-s{grid-column:1;font-size:.875rem;color:var(--label2)}
.hero-v{grid-column:2;grid-row:2/4;font-size:2.75rem;font-weight:700;line-height:.95;color:var(--tint)}
.hero-v small{font-size:.875rem;font-weight:600;margin-left:.2rem;color:var(--label2)}

/* game cards */
.game{display:flex;flex-direction:column;gap:.75rem;width:100%;padding:1rem;transition:background .15s}
.game:active,.row:active{background:var(--fill)}
.ghead{display:flex;justify-content:space-between;align-items:center;font-size:.8125rem;font-weight:600;color:var(--label2)}
.chev{width:.55rem;height:.55rem;border-right:2px solid currentColor;border-top:2px solid currentColor;transform:rotate(45deg);opacity:.6;flex:none;margin-right:.15rem}
.side{display:flex;align-items:center;gap:.75rem}
.abbr{flex:none;width:3.125rem;height:2.125rem;border-radius:.625rem;background:var(--fill);color:var(--label);display:grid;place-items:center;font:700 .8125rem var(--round);letter-spacing:.04em}
.side .nm{flex:1;min-width:0;font-weight:600}
.side .topp{display:block;font-size:.8125rem;font-weight:400;color:var(--label2);overflow-wrap:anywhere}
.side .big{font:700 1.375rem var(--round)}

/* segmented */
.seg{display:flex;background:var(--fill);border-radius:.75rem;padding:2px;gap:2px}
.seg button{flex:1;min-height:2.375rem;border-radius:.625rem;text-align:center;font-size:.875rem;font-weight:600;color:var(--label2);min-width:0}
.seg button[aria-pressed="true"]{background:var(--seg-on);color:var(--label);box-shadow:0 1px 3px rgba(0,0,0,.14)}

/* rows */
.row{display:flex;align-items:center;gap:.75rem;width:100%;min-height:3.5rem;padding:.6rem 1rem;position:relative;transition:background .15s}
.row + .row::before{content:"";position:absolute;left:3rem;right:0;top:0;height:.5px;background:var(--sep)}
.row .rk{flex:none;width:1.25rem;font:700 .8125rem var(--round);color:var(--label2);text-align:center}
.row .who{flex:1;min-width:0}
.row .who b{display:block;font-weight:600;overflow-wrap:anywhere}
.row .who > span{font-size:.8125rem;color:var(--label2)}
.row .proj{flex:none;font:700 1.375rem var(--round);text-align:right;min-width:3rem}
.row.off b,.row.off .proj{color:var(--label2);font-weight:500}
.row.plain{min-height:2.75rem;font-size:.9375rem}.row.plain + .row.plain::before{left:1rem}
.row.plain .k{flex:1}.row.plain .v{color:var(--label2);text-align:right}
.pill{display:inline-block;font-size:.6875rem;font-weight:700;padding:.1rem .45rem;border-radius:999px;margin-left:.35rem;vertical-align:.1em;letter-spacing:.02em}
.pill.q{background:var(--attn-bg);color:var(--attn)}.pill.o{background:var(--red-bg);color:var(--red)}.pill.e{background:var(--tint-bg);color:var(--tint)}

/* steps */
.steps{padding:.25rem 1rem}
.step{display:flex;align-items:center;gap:.75rem;min-height:3rem;padding:.55rem 0}
.step + .step{border-top:.5px solid var(--sep)}
.step .n{flex:none;width:1.625rem;height:1.625rem;border-radius:50%;background:var(--tint-bg);color:var(--tint);font:700 .8125rem var(--round);display:grid;place-items:center}
.step .t{flex:1;min-width:0;font-size:.9375rem}
.step .t small{display:block;font-size:.75rem;color:var(--label2);margin-top:.1rem}
.step .v{flex:none;font:700 1.0625rem var(--round)}
.btn2{min-height:2.75rem;width:100%;text-align:center;color:var(--tint);font-weight:600;border-radius:999px;background:var(--tint-bg);transition:opacity .15s}
.btn2:active{opacity:.55}

/* sheet */
.scrim{position:fixed;inset:0;z-index:10;background:var(--scrim);animation:fade .3s ease both}
.sheet{position:fixed;z-index:11;left:1rem;right:1rem;bottom:1rem;max-width:36rem;margin:0 auto;height:auto;
  max-height:calc(100% - max(env(safe-area-inset-top),1.25rem) - 1.625rem);display:flex;flex-direction:column;overflow:hidden;
  background:var(--sheet);border-radius:2rem;box-shadow:0 0 0 .5px var(--lg-edge2),0 .75rem 2.5rem rgba(0,0,0,.32);
  animation:rise .42s cubic-bezier(.32,.72,0,1) both;touch-action:pan-y}
.sheet .card{background:var(--inset);border-radius:1rem}
.closing .sheet{animation:drop .3s cubic-bezier(.32,.72,0,1) both}
.closing .scrim{animation:fade .3s ease reverse both}
.grab{flex:none;width:36px;height:5px;border-radius:3px;background:var(--sw-off);margin:.5rem auto 0}
.sh-head{flex:none;display:flex;align-items:center;min-height:3rem;padding:0 1.25rem}
.sh-head h2{flex:1;margin:0;font-size:1.0625rem;font-weight:600;text-align:center;overflow-wrap:anywhere}
.sh-head .sp{width:3.5rem;flex:none}
.sh-head button{width:3.5rem;flex:none;min-height:2.75rem;color:var(--tint);font-weight:600;text-align:right}
.sh-body{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain;padding:.5rem 1rem 1rem;display:flex;flex-direction:column;gap:.75rem}
.result{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;padding:1rem}
.result span{font-size:.9375rem;color:var(--label2)}
.result b{font:700 2.75rem/1 var(--round);color:var(--tint)}
.stepper{display:flex;align-items:center;gap:.4rem;flex:none}
.stepper button{width:2.75rem;height:2.75rem;border-radius:.75rem;background:var(--fill);text-align:center;font-size:1.375rem;font-weight:500;color:var(--tint)}
.stepper button:active{opacity:.55}
.stepper b{min-width:2.75rem;text-align:center;font:700 1.0625rem var(--round)}
.sw{flex:none;position:relative;width:3.1875rem;height:1.9375rem;border-radius:999px;background:var(--sw-off);transition:background .2s}
.sw::before{content:"";position:absolute;inset:-.4rem}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:1.6875rem;height:1.6875rem;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.sw[aria-checked="true"]{background:var(--green)}.sw[aria-checked="true"]::after{transform:translateX(1.25rem)}

/* toast */
#toast{position:fixed;z-index:20;left:50%;bottom:calc(5.75rem);transform:translate(-50%,1rem);opacity:0;pointer-events:none;display:flex;align-items:center;gap:.75rem;
  padding:.65rem 1.1rem;border-radius:999px;font-size:.9375rem;font-weight:600;color:var(--lg-ink);background:var(--lg-tint);
  -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:inset 0 0 0 .5px var(--lg-edge2),0 6px 20px var(--lg-sh);transition:opacity .25s,transform .25s;max-width:calc(100% - 2rem)}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{color:var(--tint);font-weight:700;min-height:2rem}

/* page slide */
.pg{position:fixed;top:0;left:0;right:0;z-index:1;pointer-events:none}
html.pg-run{overflow-x:hidden}html.pg-run body{overflow-x:clip}
#view.pg-in{position:relative;z-index:2;animation:pgin .42s cubic-bezier(.32,.72,0,1) both;box-shadow:-10px 0 28px rgba(0,0,0,.22)}
.pg.pg-under{animation:pgunder .42s cubic-bezier(.32,.72,0,1) both}
.pg.pg-out{z-index:3;animation:pgout .42s cubic-bezier(.32,.72,0,1) both;box-shadow:-10px 0 28px rgba(0,0,0,.22)}
#view.pg-back-in{animation:pgbackin .42s cubic-bezier(.32,.72,0,1) both}
@keyframes pgin{from{transform:translateX(100%)}to{transform:none}}
@keyframes pgunder{to{transform:translateX(-28%);opacity:.78}}
@keyframes pgout{to{transform:translateX(100%)}}
@keyframes pgbackin{from{transform:translateX(-28%);opacity:.78}to{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(calc(100% + 1.5rem))}to{transform:none}}
@keyframes drop{to{transform:translateY(calc(100% + 1.5rem))}}
@keyframes fade{from{opacity:0}to{opacity:1}}

@media (prefers-reduced-motion:reduce){
  .pg{display:none}#view.pg-in,#view.pg-back-in{animation:fade .15s both;box-shadow:none}
  .sheet,.scrim,.closing .sheet,.closing .scrim{animation-duration:.01s}
  #view,#nav,#tabbar,.tb-ind,.sw,.sw::after{transition:none}#tabbar.tap,#tabbar.tap::after{animation:none}
  body.sheet-open #view,body.sheet-open #nav{transform:none}
}
@media (prefers-reduced-transparency:reduce){#tabbar,.glassbtn,#toast{background:var(--card);-webkit-backdrop-filter:none;backdrop-filter:none}.nav-bg::before{display:none}.nav-bg{background:var(--bg)}}
@media (prefers-contrast:more){:root{--sep:currentColor;--label2:var(--label)}.card,.sheet,#tabbar,.glassbtn{box-shadow:0 0 0 1.5px var(--label)}}
@media (forced-colors:active){.card,.sheet,#tabbar,.glassbtn,.seg button[aria-pressed="true"]{border:1px solid CanvasText}.tb-ind{background:Highlight;opacity:.3}}

</style>

/* Shared helpers. Everything sport-specific lives in part-sports.js */
function gameOf(t){return SLATE.games.find(x=>x.away===t||x.home===t)}
function opponent(t){const g=gameOf(t);return g.away===t?g.home:g.away}
function matchupFor(t,pos){
  const idx=(SPORT.groups[pos]||Object.values(SPORT.groups)[0]).cols, d=SLATE.defense&&SLATE.defense[opponent(t)], avg=a=>idx.reduce((s,k)=>s+a[k],0)/idx.length;
  return d?avg(d)/avg(SLATE.leagueDefense):1;
}
let edits=DB.get('edits',{min:{},play:{}}); if(!edits.min||!edits.play) edits={min:{},play:{}};
const pid=(t,i)=>SPORT.id+':'+t+':'+SLATE.teams[t].players[i][0];
function player(t,i){
  const [name,pos,min,pts,status]=SLATE.teams[t].players[i], id=pid(t,i);
  const playing=id in edits.play?edits.play[id]:status!=='O';
  const minutes=id in edits.min?edits.min[id]:min;
  return {t,i,id,name,pos,min,pts,status,playing,minutes,edited:(id in edits.min)||(id in edits.play),opp:opponent(t),...SPORT.project(min,pts,minutes,matchupFor(t,pos))};
}
function roster(t){
  const all=SLATE.teams[t].players.map((_,i)=>player(t,i));
  return {on:all.filter(p=>p.playing).sort((a,b)=>b.result-a.result),off:all.filter(p=>!p.playing)};
}
function slateTeams(){return SLATE.games.flatMap(g=>[g.away,g.home])}
function leaders(pos){
  return slateTeams().flatMap(t=>roster(t).on).filter(p=>!pos||p.pos===pos).sort((a,b)=>b.result-a.result);
}
const hasEdits=()=>Object.keys(edits.min).length+Object.keys(edits.play).length>0;
const $=s=>document.querySelector(s);
const f1=n=>n.toFixed(1);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=m=>{const d=Math.round((m-1)*100);return d===0?'an average amount':Math.abs(d)+'% '+(d>0?'more':'less')+' than average'};
function day(utc){return new Date(utc).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}
function clock(utc){return new Date(utc).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}

/* SPORTS REGISTRY
   To add a sport: 1) add its data file (same shape as part-data-nba.js)  2) add one registerSport({...}) block below.
   The screens read everything from the active sport, so they need no changes. */
const SPORTS={}, SPORT_ORDER=[];
function registerSport(def){SPORTS[def.id]=def;SPORT_ORDER.push(def.id)}

registerSport({
  id:'nba', league:'NBA', sport:'Basketball', stat:'points', unit:'pts',
  slate:NBA_SLATE,
  async load(){ return this.slate; },           // the API call goes here later
  // position groups: which defense columns each group uses, and how to name it
  groups:{G:{cols:[0,1],name:'guards',label:'Guards'},F:{cols:[2,3],name:'forwards',label:'Forwards'},C:{cols:[4],name:'centers',label:'Centers'}},
  steps:['Points per minute','Minutes he plays','Multiply 1 by 2','Points per game, adjusted for the defense he faces','Add 3 and 4, divide by 2'],
  // the model from the video
  project(seasonMin,seasonAvg,minutesTonight,matchup){
    const rate=seasonMin>0?seasonAvg/seasonMin:0, byMinutes=rate*minutesTonight, vsDefense=seasonAvg*matchup;
    return {rate,byMinutes,avg:seasonAvg,matchup,vsDefense,result:(byMinutes+vsDefense)/2};
  },
  // the same model, written out for one player (shown in his sheet)
  explain(p){
    const g=this.groups[p.pos]||this.groups.F;
    return [
      {t:'Points per minute',v:p.rate.toFixed(2)},
      {t:'Minutes tonight',stepper:f1(p.minutes)},
      {t:`${f1(p.minutes)} × ${p.rate.toFixed(2)}`,v:f1(p.byMinutes)},
      {t:`${f1(p.avg)} points per game × ${p.matchup.toFixed(2)}`,sub:`${p.opp} allow ${g.name} ${pct(p.matchup)}`,v:f1(p.vsDefense)},
      {t:`(${f1(p.byMinutes)} + ${f1(p.vsDefense)}) ÷ 2`,v:f1(p.result)}
    ];
  }
});

let SPORT=SPORTS[DB.get('sport','nba')]||SPORTS.nba, SLATE=SPORT.slate;
function setSport(id){ if(!SPORTS[id]) return; SPORT=SPORTS[id]; SLATE=SPORT.slate; DB.set('sport',id); }

const cur=()=>nav.stack[nav.stack.length-1]||null;
function pageTitle(){
  const c=cur(); if(c){const g=SLATE.games.find(x=>x.id===c.id);return g.away+' at '+g.home}
  return {games:'Games',top:'Top picks',formula:'Formula'}[nav.tab];

function head(eyebrow,title,sub){
  return `<header class="lt-wrap"><span class="eyebrow">${eyebrow}</span><h1 class="lt" id="lt">${esc(title)}</h1>${sub?`<span class="sub">${sub}</span>`:''}</header>`;
}
function sideHTML(t){
  const top=roster(t).on[0];
  return `<div class="side"><span class="abbr">${t}</span><span class="nm">${SLATE.teams[t].name}<span class="topp">${top?esc(top.name):'No players'}</span></span><span class="big num">${top?f1(top.result):''}</span></div>`;
}
function viewGames(){
  const best=leaders()[0], d0=day(SLATE.games[0].utc);
  return sportPicker()+head(SPORT.league+' · next slate','Games',`${SLATE.games.length} games · ${d0}, your time`)+
  (best?`<button class="hero" data-do="player" data-t="${best.t}" data-i="${best.i}" aria-label="Top projection: ${esc(best.name)}, ${f1(best.result)} ${SPORT.stat}">
    <span class="hero-k">Top projection</span><span class="hero-n">${esc(best.name)}</span>
    <span class="hero-s">${SLATE.teams[best.t].name} vs ${SLATE.teams[best.opp].name}</span>
    <span class="hero-v num">${f1(best.result)}<small>${SPORT.unit}</small></span></button>`:'')+
  `<div class="sec">Tip-offs</div>`+
  SLATE.games.map(g=>`<button class="card game" data-do="open" data-id="${g.id}" aria-label="${g.away} at ${g.home}, open players">
    <div class="ghead"><span>${day(g.utc)} · ${clock(g.utc)}</span><i class="chev"></i></div>${sideHTML(g.away)}${sideHTML(g.home)}</button>`).join('')+
  `<p class="note">Each game shows its top projected scorer. Tap a game for every player.</p>`;
}
function rowHTML(p,rank,withTeam){
  const pill=p.status==='Q'&&p.playing?'<span class="pill q">Questionable</span>':(!p.playing?'<span class="pill o">Out</span>':'');
  const ed=p.id in edits.min?'<span class="pill e">Edited</span>':'';
  const sub=withTeam?`${p.t} vs ${p.opp} · ${p.pos}`:`${p.pos} · ${f1(p.minutes)} min`;
  return `<button class="row ${p.playing?'':'off'}" data-do="player" data-t="${p.t}" data-i="${p.i}">
    <span class="rk num">${rank||''}</span><span class="who"><b>${esc(p.name)}${pill}${ed}</b><span class="num">${sub}</span></span>
    <span class="proj num">${p.playing?f1(p.result):'–'}</span></button>`;
}
function viewGame(c){
  const g=SLATE.games.find(x=>x.id===c.id), r=roster(c.team);
  return head(SPORT.league+' · '+day(g.utc)+' · '+clock(g.utc),g.away+' at '+g.home,'')+
  `<div class="seg" role="group" aria-label="Team">${[g.away,g.home].map(x=>`<button data-do="team" data-t="${x}" aria-pressed="${x===c.team}">${SLATE.teams[x].name}</button>`).join('')}</div>
  <div class="sec">Projected ${SPORT.stat}</div>
  <div class="card">${r.on.map((p,k)=>rowHTML(p,k+1)).join('')||'<div class="row plain">No players</div>'}</div>
  ${r.off.length?`<div class="sec">Not playing</div><div class="card">${r.off.map(p=>rowHTML(p)).join('')}</div>`:''}
  <p class="note">Tap a player to see the 5 steps and change his minutes.</p>`;
}
function viewTop(){
  const list=leaders(topPos).slice(0,25);
  return head(SPORT.league+' · next slate','Top picks','Highest projections across all games')+
  `<div class="seg" role="group" aria-label="Position">${[['','All'],...Object.entries(SPORT.groups).map(([k,g])=>[k,g.label])].map(([k,l])=>`<button data-do="pos" data-p="${k}" aria-pressed="${k===topPos}">${l}</button>`).join('')}</div>
  <div class="card">${list.map((p,k)=>rowHTML(p,k+1,true)).join('')||'<div class="row plain">No players</div>'}</div>`;
}
function stepsHTML(p){
  const rows=p?SPORT.explain(p):SPORT.steps.map(t=>({t}));
  return rows.map((r,k)=>`<div class="step"><span class="n">${k+1}</span><span class="t">${r.t}${r.sub?`<small>${r.sub}</small>`:''}</span>${
    r.stepper!=null?`<span class="stepper"><button data-do="min" data-d="-1" aria-label="One minute less">−</button><b class="num">${r.stepper}</b><button data-do="min" data-d="1" aria-label="One minute more">+</button></span>`
    :r.v!=null?`<span class="v num">${r.v}</span>`:''}</div>`).join('');
}
function sportPicker(){
  if(SPORT_ORDER.length<2) return '';
  return `<div class="seg" role="group" aria-label="Sport">${SPORT_ORDER.map(id=>`<button data-do="sport" data-s="${id}" aria-pressed="${id===SPORT.id}">${SPORTS[id].league}</button>`).join('')}</div>`;
}
function viewFormula(){
  const R=(k,v)=>`<div class="row plain"><span class="k">${k}</span><span class="v">${v}</span></div>`;
  return head(SPORT.league+' · how it works','Formula',`${SPORT.steps.length} steps for every player`)+
  `<div class="card steps">${stepsHTML()}</div>
  <div class="sec">Where the numbers come from</div>
  <div class="card">${R('Sport',SPORT.sport+' · '+SPORT.league)}${R('Player stats','ESPN')}${R('Injuries','ESPN')}${R('Defense by position','Hashtag Basketball')}${R('Checked',SLATE.checked)}</div>
  <p class="note">Questionable players may not play. This is a simple estimate, not a guarantee.</p>
  ${hasEdits()?'<button class="btn2" data-do="resetall">Reset my changes</button>':''}
  ${STANDALONE?'':'<div class="sec">Install</div><div class="card"><div class="row plain"><span class="k">In Safari, tap Share, then Add to Home Screen.</span></div></div>'}`;
}
function sheetBody(){
  const p=player(sheet.t,sheet.i);
  return `<div class="card result"><span>Projected ${SPORT.stat}<br>${p.t} vs ${p.opp}</span><b class="num">${p.playing?f1(p.result):'–'}</b></div>
  <div class="card steps">${stepsHTML(p)}</div>
  <div class="card steps"><div class="step"><span class="t" style="font-size:1.0625rem">Playing tonight</span><button class="sw" role="switch" aria-checked="${p.playing}" aria-label="Playing tonight" data-do="play"></button></div></div>
  ${p.edited?'<button class="btn2" data-do="reset">Reset his minutes and status</button>':''}`;
}
function sheetShell(title,body){
  return `<div class="scrim" data-do="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
  <div class="grab"></div><div class="sh-head"><span class="sp"></span><h2>${esc(title)}</h2><button data-do="close" id="sh-done">Done</button></div>
  <div class="sh-body" id="sh-body">${body}</div></div>`;
}

const view=$('#view'), navEl=$('#nav'), bar=$('#tabbar'), root=$('#sheet-root'), toastEl=$('#toast');
const REDUCE=()=>{try{return matchMedia('(prefers-reduced-motion:reduce)').matches}catch(e){return false}};
let ltObs=null, pgUntil=0;
function renderAll(){
  const c=cur();
  view.innerHTML=c?viewGame(c):nav.tab==='games'?viewGames():nav.tab==='top'?viewTop():viewFormula();
  navEl.innerHTML=`<div class="nav-bg"></div><div class="nav-row">${c?`<button class="glassbtn" data-do="back" aria-label="Back">${ICON.back}</button>`:'<span class="nb-sp"></span>'}<span class="nav-title" aria-hidden="true">${esc(pageTitle())}</span><span class="nb-sp"></span></div>`;
  navEl.classList.remove('show-title');
  bar.style.setProperty('--i',TABS.findIndex(t=>t[0]===nav.tab));
  bar.querySelectorAll('button').forEach(b=>b.dataset.tab===nav.tab?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));
  if(ltObs) ltObs.disconnect();
  const lt=$('#lt');
  if(lt&&'IntersectionObserver' in window){
    ltObs=new IntersectionObserver(e=>navEl.classList.toggle('show-title',!e[0].isIntersecting),{rootMargin:'-56px 0px 0px 0px'});
    ltObs.observe(lt);
  }
  DB.set('nav',nav);
}
/* page slide */
function pgSnap(){
  const c=view.cloneNode(true); c.removeAttribute('id'); c.querySelectorAll('[id]').forEach(e=>e.removeAttribute('id'));
  c.className='view pg'; c.setAttribute('aria-hidden','true'); c.inert=true; c.style.top=(-scrollY)+'px';
  document.body.appendChild(c); document.documentElement.classList.add('pg-run'); return c;
}
function pgRun(dir,snap){
  const a=dir==='fwd'?'pg-in':'pg-back-in'; view.classList.add(a); snap.classList.add(dir==='fwd'?'pg-under':'pg-out');
  pgUntil=Date.now()+480;
  setTimeout(()=>{snap.remove();view.classList.remove(a);document.documentElement.classList.remove('pg-run')},REDUCE()?160:480);
}
function push(entry){ if(Date.now()<pgUntil) return; const s=pgSnap(); (cur()||nav).y=scrollY; nav.stack.push(entry); renderAll(); scrollTo(0,0); pgRun('fwd',s); }
function pop(){ if(Date.now()<pgUntil||!cur()) return; const s=pgSnap(); nav.stack.pop(); renderAll(); scrollTo(0,(cur()||nav).y||0); pgRun('back',s); }
/* tab bar */
bar.style.setProperty('--n',TABS.length);
bar.innerHTML='<span class="tb-ind"></span>'+TABS.map(([k,l])=>`<button data-do="tab" data-tab="${k}">${ICON[k]}<span>${l}</span></button>`).join('');
let lastY=0;
addEventListener('scroll',()=>{
  const y=scrollY;
  if(y<=8) bar.classList.remove('min'); else if(y>lastY+4&&y>12) bar.classList.add('min'); else if(y<lastY-4) bar.classList.remove('min');
  lastY=y;
},{passive:true});
function tapBar(){bar.classList.remove('tap');void bar.offsetWidth;bar.classList.add('tap');setTimeout(()=>bar.classList.remove('tap'),650)}
/* sheet */
let opener=null;
function openSheet(t,i){
  if(sheet) return; sheet={t,i}; opener={t,i};
  root.classList.remove('closing'); root.innerHTML=sheetShell(player(t,i).name,sheetBody());
  document.documentElement.style.setProperty('--sy',(scrollY-view.offsetTop+innerHeight*.3)+'px');
  document.body.classList.add('sheet-open'); view.inert=true; bar.inert=true; navEl.inert=true;
  const d=$('#sh-done'); if(d) d.focus({preventScroll:true});
  bindDrag(root.querySelector('.sheet'));
}
function closeSheet(){
  if(!sheet) return; sheet=null; root.classList.add('closing');
  document.body.classList.remove('sheet-open'); document.documentElement.style.removeProperty('--pscale');
  view.inert=false; bar.inert=false; navEl.inert=false;
  const sc=root.querySelector('.scrim'); if(sc) sc.style.opacity='';
  setTimeout(()=>{ if(!sheet){root.innerHTML='';root.classList.remove('closing')} },REDUCE()?20:300);
  if(opener){const b=view.querySelector(`[data-do="player"][data-t="${opener.t}"][data-i="${opener.i}"]`); if(b) b.focus({preventScroll:true});}
}
function bindDrag(el){
  let y0=null,dy=0,t0=0,h=0; const body=el.querySelector('.sh-body'), sc=root.querySelector('.scrim');
  el.addEventListener('touchstart',e=>{
    if(e.target.closest('button')&&!e.target.closest('.sh-head')) {y0=null;return}
    if(body.contains(e.target)&&body.scrollTop>0){y0=null;return}
    y0=e.touches[0].clientY;dy=0;t0=Date.now();h=el.offsetHeight;el.style.animation='none';el.style.transition='none';
  },{passive:true});
  el.addEventListener('touchmove',e=>{
    if(y0==null) return; dy=e.touches[0].clientY-y0;
    const m=dy>0?dy:dy/6; el.style.transform=`translateY(${m}px)`;
    const pr=Math.max(0,Math.min(1,dy/h));
    document.documentElement.style.setProperty('--pscale',.95+.05*pr); if(sc) sc.style.opacity=1-pr;
    if(dy>0&&e.cancelable) e.preventDefault();
  },{passive:false});
  el.addEventListener('touchend',()=>{
    if(y0==null) return; const v=dy/Math.max(1,Date.now()-t0); y0=null;
    if(dy>h*.28||(v>.5&&dy>24)){
      el.style.transition='transform .3s cubic-bezier(.32,.72,0,1)'; el.style.transform=`translateY(${h+32}px)`;
      sheet=sheet; const s=sheet; sheet=null; document.body.classList.remove('sheet-open'); document.documentElement.style.removeProperty('--pscale');
      view.inert=false; bar.inert=false; navEl.inert=false; if(sc){sc.style.transition='opacity .3s';sc.style.opacity=0}
      setTimeout(()=>{ if(!sheet) root.innerHTML='' },300);
    }else{
      el.style.transition='transform .42s cubic-bezier(.2,.9,.3,1)'; el.style.transform='';
      document.documentElement.style.removeProperty('--pscale'); if(sc) sc.style.opacity='';
    }
  });
}
/* toast */
let toastT=0, undo=null;
function toast(msg,undoFn){
  undo=undoFn||null; toastEl.innerHTML=`<span>${esc(msg)}</span>${undo?'<button data-do="undo">Undo</button>':''}`;
  toastEl.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>toastEl.classList.remove('on'),4000);
}
function refresh(){ const y=scrollY; renderAll(); scrollTo(0,y); if(sheet){const b=$('#sh-body'); if(b) b.innerHTML=sheetBody();} }
/* events */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-do]'); if(!b) return; const d=b.dataset;
  switch(d.do){
    case 'tab':
      tapBar();
      if(d.tab===nav.tab&&!cur()){ scrollTo({top:0,behavior:REDUCE()?'auto':'smooth'}); break; }
      nav.tab=d.tab; nav.stack=[]; nav.y=0; renderAll(); scrollTo(0,0); break;
    case 'open': push({v:'game',id:d.id,team:SLATE.games.find(g=>g.id===d.id).away}); break;
    case 'back': pop(); break;
    case 'team': cur().team=d.t; refresh(); break;
    case 'pos': topPos=d.p; refresh(); break;
    case 'sport': setSport(d.s); topPos=''; nav={tab:'games',stack:[]}; renderAll(); scrollTo(0,0); break;
    case 'player': openSheet(d.t,+d.i); break;
    case 'close': closeSheet(); break;
    case 'undo': if(undo){undo();undo=null;toastEl.classList.remove('on')} break;
    case 'resetall': { const old=JSON.parse(JSON.stringify(edits)); edits={min:{},play:{}}; DB.set('edits',edits); refresh();
      toast('Changes reset',()=>{edits=old;DB.set('edits',edits);refresh()}); break; }
    default: if(sheet){
      const p=player(sheet.t,sheet.i);
      if(d.do==='min') edits.min[p.id]=Math.max(0,Math.min(48,Math.round(p.minutes+(+d.d))));
      if(d.do==='play') edits.play[p.id]=!p.playing;
      if(d.do==='reset'){delete edits.min[p.id];delete edits.play[p.id]}
      DB.set('edits',edits); refresh();
    }
  }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&sheet) closeSheet(); });
SPORT.load().then(s=>{ SLATE=s; renderAll(); scrollTo(0,0); });
if('serviceWorker' in navigator && location.protocol==='https:'){ try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){} }

</script>
</body>
</html>
