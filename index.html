/* Propline. Native iOS neutrals. Roles: burgundy = interactive + the key number, butter yellow = attention. Layout: iOS large title, floating glass tab bar, floating sheets. */
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Segoe UI",Roboto,sans-serif;
  --round:var(--font);
  --bg:#F2F2F7; --bg-rgb:242,242,247; --card:#FFFFFF; --sheet:#F2F2F7; --inset:#FFFFFF;
  --label:#1C1C1E; --label2:rgba(60,60,67,.66); --sep:rgba(60,60,67,.18); --fill:rgba(120,120,128,.12); --sw-off:rgba(120,120,128,.3);
  --tint:#731328; --tint-bg:rgba(115,19,40,.09);
  --attn:#7A5200; --attn-fill:#FEC40B; --attn-bg:rgba(254,196,11,.28);
  --red:#C5221F; --red-bg:rgba(255,59,48,.12); --green:#34C759; --pos:#1A7F37; --pos-bg:rgba(52,199,89,.16); --on-tint:#FFFFFF; --tile-ring:rgba(0,0,0,.06); --yel:#7A5A00; --yel-bg:rgba(254,196,11,.32); --org:#B54708; --org-bg:rgba(255,149,0,.18);
  --glow:radial-gradient(120% 100% at 0% 0%,rgba(115,19,40,.2),transparent 62%),radial-gradient(90% 90% at 100% 0%,rgba(254,196,11,.17),transparent 60%);
  --scrim:rgba(0,0,0,.46); --seg-on:#FFFFFF;
  --lg-tint:rgba(255,255,255,.62); --lg-edge2:rgba(60,60,67,.16); --lg-rim:#fff; --lg-rim2:rgba(60,60,67,.2);
  --lg-act:rgba(120,120,128,.16); --lg-ink:rgba(28,28,30,.82); --lg-sh:rgba(0,0,0,.18); --lg-spec:rgba(255,255,255,.5); --lg-flash:rgba(255,255,255,.85);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#000000; --bg-rgb:0,0,0; --card:#1C1C1E; --sheet:#1C1C1E; --inset:#2C2C2E;
  --label:#FFFFFF; --label2:rgba(235,235,245,.64); --sep:rgba(84,84,88,.6); --fill:rgba(120,120,128,.24); --sw-off:rgba(120,120,128,.42);
  --tint:#FF8FA6; --tint-bg:rgba(255,143,166,.16);
  --attn:#FEC40B; --attn-fill:#FEC40B; --attn-bg:rgba(254,196,11,.2);
  --red:#FF6961; --red-bg:rgba(255,69,58,.2); --green:#30D158; --pos:#30D158; --pos-bg:rgba(48,209,88,.2); --on-tint:#1C1C1E; --tile-ring:rgba(255,255,255,.22); --yel:#FFD54A; --yel-bg:rgba(254,196,11,.18); --org:#FFA552; --org-bg:rgba(255,149,0,.2);
  --glow:radial-gradient(120% 100% at 0% 0%,rgba(190,40,78,.42),transparent 62%),radial-gradient(90% 90% at 100% 0%,rgba(254,196,11,.1),transparent 60%);
  --scrim:rgba(0,0,0,.58); --seg-on:#636366;
  --lg-tint:rgba(44,44,46,.68); --lg-edge2:rgba(255,255,255,.1); --lg-rim:rgba(255,255,255,.16); --lg-rim2:rgba(255,255,255,.05);
  --lg-act:rgba(255,255,255,.14); --lg-ink:rgba(255,255,255,.9); --lg-sh:rgba(0,0,0,.5); --lg-spec:rgba(255,255,255,.06); --lg-flash:rgba(255,255,255,.22);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#000000; --bg-rgb:0,0,0; --card:#1C1C1E; --sheet:#1C1C1E; --inset:#2C2C2E;
  --label:#FFFFFF; --label2:rgba(235,235,245,.64); --sep:rgba(84,84,88,.6); --fill:rgba(120,120,128,.24); --sw-off:rgba(120,120,128,.42);
  --tint:#FF8FA6; --tint-bg:rgba(255,143,166,.16);
  --attn:#FEC40B; --attn-fill:#FEC40B; --attn-bg:rgba(254,196,11,.2);
  --red:#FF6961; --red-bg:rgba(255,69,58,.2); --green:#30D158; --pos:#30D158; --pos-bg:rgba(48,209,88,.2); --on-tint:#1C1C1E; --tile-ring:rgba(255,255,255,.22); --yel:#FFD54A; --yel-bg:rgba(254,196,11,.18); --org:#FFA552; --org-bg:rgba(255,149,0,.2);
  --glow:radial-gradient(120% 100% at 0% 0%,rgba(190,40,78,.42),transparent 62%),radial-gradient(90% 90% at 100% 0%,rgba(254,196,11,.1),transparent 60%);
  --scrim:rgba(0,0,0,.58); --seg-on:#636366;
  --lg-tint:rgba(44,44,46,.68); --lg-edge2:rgba(255,255,255,.1); --lg-rim:rgba(255,255,255,.16); --lg-rim2:rgba(255,255,255,.05);
  --lg-act:rgba(255,255,255,.14); --lg-ink:rgba(255,255,255,.9); --lg-sh:rgba(0,0,0,.5); --lg-spec:rgba(255,255,255,.06); --lg-flash:rgba(255,255,255,.22);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;touch-action:manipulation;background:var(--bg)}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--label);font:1.0625rem/1.3 var(--font);-webkit-font-smoothing:antialiased;
  padding-bottom:calc(7rem + env(safe-area-inset-bottom));overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
button:focus-visible{outline:2px solid var(--tint);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
svg.ic{width:1.5rem;height:1.5rem;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pc{--tg:var(--tcd)}}
:root[data-theme="dark"] .pc{--tg:var(--tcd)}

/* page */
.view{max-width:36rem;margin:0 auto;min-height:100vh;min-height:100dvh;background-color:var(--bg);background-image:var(--glow);background-repeat:no-repeat;background-size:100% 24rem;
  padding:calc(env(safe-area-inset-top) + 3.75rem) calc(1rem + env(safe-area-inset-right)) 1rem calc(1rem + env(safe-area-inset-left));
  display:flex;flex-direction:column;gap:1.25rem}
#view,#nav{transition:transform .5s cubic-bezier(.32,.72,0,1);transform-origin:50% var(--sy,0px)}
body.sheet-open #view,body.sheet-open #nav{transform:scale(var(--pscale,.95))}
.lt-wrap{display:flex;flex-direction:column;gap:.2rem;padding:0 .25rem}
.eyebrow{font-size:.8125rem;font-weight:700;color:var(--tint);text-transform:uppercase;letter-spacing:.06em}
.lt{font:700 2.125rem/1.08 var(--round);margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{font-size:.9375rem;color:var(--label2)}
.sec{font-size:.8125rem;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.04em;padding:0 1rem;margin-bottom:-.75rem}
.note{font-size:.8125rem;line-height:1.4;color:var(--label2);padding:0 1rem;margin:0}
.card{background:var(--card);border-radius:1.375rem;overflow:hidden;box-shadow:0 0 0 .5px var(--sep)}

/* top area */
#nav{position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none}
.nav-bg{opacity:0;transition:opacity .25s}
#nav.show-title .nav-bg{opacity:1}
.nav-bg{position:absolute;inset:0 0 -1rem 0;background:linear-gradient(rgba(var(--bg-rgb),.72),rgba(var(--bg-rgb),0))}
.nav-bg::before{content:"";position:absolute;inset:0;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);-webkit-mask:linear-gradient(#000 40%,transparent);mask:linear-gradient(#000 40%,transparent)}
.nav-row{position:relative;max-width:36rem;margin:0 auto;display:flex;align-items:center;gap:.5rem;height:3.25rem;
  padding:0 calc(1rem + env(safe-area-inset-right)) 0 calc(1rem + env(safe-area-inset-left));margin-top:env(safe-area-inset-top)}
.nb-sp{width:2.75rem;flex:none}
.nav-title{flex:1;text-align:center;font-weight:600;opacity:0;transform:translateY(.35rem);transition:opacity .2s,transform .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nav.show-title .nav-title{opacity:1;transform:none}
.glassbtn{pointer-events:auto;flex:none;width:2.75rem;height:2.75rem;border-radius:50%;display:grid;place-items:center;color:var(--lg-ink);
  background:var(--lg-tint);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  box-shadow:inset .5px .5px 0 0 var(--lg-rim),inset -.5px -.5px 0 0 var(--lg-rim2),inset 0 0 0 .5px var(--lg-edge2),0 4px 14px var(--lg-sh);transition:transform .2s}
.glassbtn:active{transform:scale(.92)}

/* tab bar */
#tabbar{position:fixed;z-index:6;left:50%;bottom:1rem;transform:translateX(-50%);width:min(calc(100% - 2rem),36rem);height:4rem;padding:.25rem;border-radius:999px;display:flex;
  background:var(--lg-tint);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  box-shadow:inset .5px .5px 0 0 var(--lg-rim),inset -.5px -.5px 0 0 var(--lg-rim2),inset 0 0 0 .5px var(--lg-edge2),0 6px 20px var(--lg-sh);
  transition:width .45s cubic-bezier(.32,.72,0,1),height .45s cubic-bezier(.32,.72,0,1)}
#tabbar::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(120% 90% at 20% 0,var(--lg-spec),transparent 60%);opacity:.5;pointer-events:none}
#tabbar::after{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--lg-flash);opacity:0;pointer-events:none}
#tabbar button{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;color:var(--lg-ink);border-radius:999px;min-width:0}
#tabbar button span{font-size:.6875rem;font-weight:600;max-height:1rem;overflow:hidden;transition:max-height .3s,opacity .3s}
#tabbar button[aria-current="page"]{color:var(--tint)}
#tabbar svg.f{display:none;fill:currentColor;stroke:none}
#tabbar button[aria-current="page"] svg.o{display:none}
#tabbar button[aria-current="page"] svg.f{display:block}
#tabbar svg.ic{transition:width .3s,height .3s}
.tb-ind{position:absolute;top:.25rem;bottom:.25rem;left:.25rem;width:calc((100% - .5rem)/var(--n));border-radius:999px;background:var(--lg-act);
  transform:translateX(calc(100%*var(--i,0)));transition:transform .55s cubic-bezier(.3,1.25,.4,1)}
#tabbar.min{width:min(calc(100% - 6rem),calc(4.5rem*var(--n) + .5rem));height:3rem}
#tabbar.min button span{max-height:0;opacity:0}
#tabbar.min svg.ic{width:1.4rem;height:1.4rem}
#tabbar.tap{animation:tbzoom .65s ease}
#tabbar.tap::after{animation:tbflash .65s ease}
@keyframes tbzoom{0%,100%{transform:translateX(-50%) scale(1)}35%{transform:translateX(-50%) scale(1.018)}}
@keyframes tbflash{0%,100%{opacity:0}30%{opacity:.28}}

/* hero */
.hero{display:grid;grid-template-columns:1fr auto;align-items:end;gap:.2rem 1rem;width:100%;padding:1rem 1.125rem;border-radius:1.375rem;background:var(--card);box-shadow:0 0 0 .5px var(--sep);transition:background .15s}
.hero:active{background:var(--fill)}
.hero-k{grid-column:1/-1;font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--tint)}
.hero-n{font-size:1.375rem;font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.hero-s{grid-column:1;font-size:.875rem;color:var(--label2)}
.hero-v{grid-column:2;grid-row:2/4;font-size:2.75rem;font-weight:700;line-height:.95;color:var(--tint)}
.hero-v small{font-size:.875rem;font-weight:600;margin-left:.2rem;color:var(--label2)}

/* game cards */
.game{display:flex;flex-direction:column;gap:.75rem;width:100%;padding:1rem;transition:background .15s}
.game:active,.row:active{background:var(--fill)}
.ghead{display:flex;justify-content:space-between;align-items:center;font-size:.8125rem;font-weight:600;color:var(--label2)}
.chev{width:.55rem;height:.55rem;border-right:2px solid currentColor;border-top:2px solid currentColor;transform:rotate(45deg);opacity:.6;flex:none;margin-right:.15rem}
.side{display:flex;align-items:center;gap:.75rem}
.abbr{flex:none;width:3.125rem;height:2.125rem;border-radius:.625rem;background:linear-gradient(135deg,var(--tc,var(--fill)) 30%,var(--tc2,var(--tc,var(--fill))));color:var(--tf,var(--label));text-shadow:var(--tsh,none);box-shadow:inset 0 0 0 1px var(--tile-ring);display:grid;place-items:center;font:700 .8125rem var(--round);letter-spacing:.04em}
.side .nm{flex:1;min-width:0;font-weight:600}
.side .topp{display:block;font-size:.8125rem;font-weight:400;color:var(--label2);overflow-wrap:anywhere}
.side .big{font:700 1.375rem var(--round)}

/* segmented */
.seg{display:flex;background:var(--fill);border-radius:.75rem;padding:2px;gap:2px}
.seg button{flex:1;min-height:2.75rem;border-radius:.625rem;text-align:center;font-size:.875rem;font-weight:600;color:var(--label2);min-width:0}
.seg button[aria-pressed="true"]{background:var(--seg-on);color:var(--label);box-shadow:0 1px 3px rgba(0,0,0,.14)}

/* rows */
.row{display:flex;align-items:center;gap:.75rem;width:100%;min-height:3.5rem;padding:.6rem 1rem;position:relative;transition:background .15s}
.row + .row::before{content:"";position:absolute;left:3rem;right:0;top:0;height:.5px;background:var(--sep)}
.row .rk{flex:none;width:1.25rem;font:700 .8125rem var(--round);color:var(--label2);text-align:center}
.row .who{flex:1;min-width:0}
.row .who b{display:block;font-weight:600;overflow-wrap:anywhere}
.row .who > span{font-size:.8125rem;color:var(--label2)}
.row .proj{flex:none;font:700 1.375rem var(--round);text-align:right;min-width:3rem}
.row.off b,.row.off .proj{color:var(--label2);font-weight:500}
.row.plain{min-height:2.75rem;font-size:.9375rem}.row.plain + .row.plain::before{left:1rem}
.row.plain .k{flex:1}.row.plain .v{color:var(--label2);text-align:right}
.pill{display:inline-block;font-size:.6875rem;font-weight:700;padding:.1rem .45rem;border-radius:999px;margin-left:.35rem;vertical-align:.1em;letter-spacing:.02em}
.pill.q{background:var(--attn-bg);color:var(--attn)}.pill.o{background:var(--red-bg);color:var(--red)}.pill.e{background:var(--tint-bg);color:var(--tint)}

/* steps */
.steps{padding:.25rem 1rem}
.step{display:flex;align-items:center;gap:.75rem;min-height:3rem;padding:.55rem 0}
.step + .step{border-top:.5px solid var(--sep)}
.step .n{flex:none;width:1.625rem;height:1.625rem;border-radius:50%;background:var(--tint-bg);color:var(--tint);font:700 .8125rem var(--round);display:grid;place-items:center}
.step .t{flex:1;min-width:0;font-size:.9375rem}
.step .t small{display:block;font-size:.75rem;color:var(--label2);margin-top:.1rem}
.step .v{flex:none;font:700 1.0625rem var(--round)}
.btn2{min-height:2.75rem;width:100%;text-align:center;color:var(--tint);font-weight:600;border-radius:999px;background:var(--tint-bg);transition:opacity .15s}
.btn2:active{opacity:.55}

/* sheet */
.scrim{position:fixed;inset:0;z-index:10;background:var(--scrim);animation:fade .3s ease both}
.sheet{position:fixed;z-index:11;left:1rem;right:1rem;bottom:calc(1rem + var(--kb,0px));max-width:36rem;margin:0 auto;height:auto;
  max-height:calc(100% - max(env(safe-area-inset-top),1.25rem) - 1.625rem - var(--kb,0px));display:flex;flex-direction:column;overflow:hidden;
  background:var(--sheet);border-radius:2rem;box-shadow:0 0 0 .5px var(--lg-edge2),0 .75rem 2.5rem rgba(0,0,0,.32);
  animation:rise .42s cubic-bezier(.32,.72,0,1) both;touch-action:pan-y}
.sheet .card{background:var(--inset);border-radius:1rem}
.closing .sheet{animation:drop .3s cubic-bezier(.32,.72,0,1) both}
.closing .scrim{animation:fade .3s ease reverse both}
.grab{flex:none;width:36px;height:5px;border-radius:3px;background:var(--sw-off);margin:.5rem auto 0}
.sh-head{flex:none;display:flex;align-items:center;min-height:3rem;padding:0 1.25rem}
.sh-head h2{flex:1;margin:0;font-size:1.0625rem;font-weight:600;text-align:center;overflow-wrap:anywhere}
.sh-head .sp{width:4.25rem;flex:none}
.sh-head button.lead{text-align:left;font-weight:400}
.sh-head button{width:4.25rem;flex:none;min-height:2.75rem;color:var(--tint);font-weight:600;text-align:right}
.sh-body{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain;padding:.5rem 1rem 1rem;display:flex;flex-direction:column;gap:.75rem}
.sh-body > *{flex:none}
.result{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;padding:1rem}
.result span{font-size:.9375rem;color:var(--label2)}
.result b{font:700 2.75rem/1 var(--round);color:var(--tint)}
.stepper{display:flex;align-items:center;gap:.4rem;flex:none}
.stepper button{width:2.75rem;height:2.75rem;border-radius:.75rem;background:var(--fill);text-align:center;font-size:1.375rem;font-weight:500;color:var(--tint)}
.stepper button:active{opacity:.55}
.stepper b{min-width:2.75rem;text-align:center;font:700 1.0625rem var(--round)}
.sw{flex:none;position:relative;width:3.1875rem;height:1.9375rem;border-radius:999px;background:var(--sw-off);transition:background .2s}
.sw::before{content:"";position:absolute;inset:-.4rem}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:1.6875rem;height:1.6875rem;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.sw[aria-checked="true"]{background:var(--green)}.sw[aria-checked="true"]::after{transform:translateX(1.25rem)}

/* player rows: main area opens the player, the icon adds a bet */
.prow{padding-top:0;padding-bottom:0;padding-right:.5rem;gap:.25rem}
.rmain{flex:1;min-width:0;align-self:stretch;display:flex;align-items:center;gap:.75rem;padding:.6rem 0;min-height:3.5rem}
.rbet{flex:none;width:2.75rem;height:2.75rem;display:grid;place-items:center;color:var(--tint);border-radius:50%;transition:background .15s}
button.rbet:active{background:var(--tint-bg)}
.fld label{flex:1}
.fld .stepper{flex:none}
.fld .stin{width:4.25rem;text-align:center;font-weight:700}

/* teams, odds, results */
.abbr.sm{display:inline-grid;width:2.625rem;height:1.75rem;font-size:.6875rem;border-radius:.5rem;vertical-align:middle}
.fld input::placeholder{font-weight:400}
.abbr.lg{width:4.25rem;height:2.875rem;font-size:1.0625rem;border-radius:.875rem}
.dot{display:inline-block;width:.75rem;height:.75rem;border-radius:50%;background:linear-gradient(135deg,var(--tc) 30%,var(--tc2,var(--tc)));box-shadow:0 0 0 1px var(--tile-ring);margin-right:.45rem;flex:none}
.seg .dot{vertical-align:.02em}
.gh-r{display:inline-flex;align-items:center;gap:.5rem}
.odd{flex:none;min-width:3.25rem;text-align:center;padding:.3rem .5rem;border-radius:.55rem;background:var(--fill);font-weight:700;font-size:.9375rem}
.fin{flex:none;font-size:1.25rem;font-weight:700;min-width:2.25rem;text-align:right}.fin.dim{color:var(--label2);font-weight:600}
.row-sec{display:flex;justify-content:space-between;align-items:center}
.link{position:relative;color:var(--tint);font-size:.8125rem;font-weight:600;text-transform:none;letter-spacing:0}
.link::after{content:"";position:absolute;inset:-.75rem -.5rem}
.hs{display:flex;gap:.75rem;overflow-x:auto;scrollbar-width:none;margin:0 -1rem;padding:.25rem 1rem;scroll-snap-type:x proximity;scroll-padding-inline:1rem}
.hs::-webkit-scrollbar{display:none}
.pc{flex:none;width:8.5rem;display:flex;flex-direction:column;align-items:flex-start;gap:.35rem;padding:.875rem;border-radius:1.25rem;--tg:var(--tc);background:linear-gradient(160deg,color-mix(in srgb,var(--tg) 24%,var(--card)),color-mix(in srgb,var(--tc2,var(--tg)) 12%,var(--card)) 45%,var(--card) 80%);box-shadow:0 0 0 .5px var(--sep);scroll-snap-align:start;transition:opacity .15s}
.pc:active{opacity:.6}
.pc b{font-size:.9375rem;font-weight:600;line-height:1.2;min-height:2.25rem;overflow-wrap:anywhere}
.pcv{font-size:1.75rem;font-weight:700;line-height:1;color:var(--tint)}
.pcs{font-size:.75rem;color:var(--label2)}
.mu{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:.5rem;padding:1.125rem 1rem;text-align:center}
.mu .tm{display:flex;flex-direction:column;align-items:center;gap:.45rem;min-width:0}
.mu .tm b{font-weight:600;overflow-wrap:anywhere}
.mu .at{font-size:.8125rem;color:var(--label2)}
.mu .sc{font-size:1.75rem;font-weight:700;line-height:1}
.sec .dot{vertical-align:-.02em}
.search{width:100%;min-height:2.75rem;border:0;border-radius:.75rem;background:var(--fill);padding:0 .9rem;font:inherit;color:var(--label);-webkit-appearance:none;appearance:none}
.search::placeholder{color:var(--label2)}
.search:focus-visible,.rrow input:focus-visible{outline:2px solid var(--tint);outline-offset:1px}
.proj small{display:block;font-size:.6875rem;font-weight:500;color:var(--label2);margin-top:.1rem}
.rrow{display:flex;align-items:center;gap:.75rem;min-height:3.5rem;padding:.5rem 1rem;position:relative}
.rrow + .rrow::before{content:"";position:absolute;left:1rem;right:0;top:0;height:.5px;background:var(--sep)}
.rrow .who{flex:1;min-width:0}.rrow .who b{display:block;font-weight:600;overflow-wrap:anywhere}.rrow .who > span{font-size:.8125rem;color:var(--label2)}
.rrow input{flex:none;width:3.75rem;min-height:2.75rem;text-align:center;border:0;border-radius:.65rem;background:var(--fill);font:inherit;font-weight:700;color:var(--label);font-variant-numeric:tabular-nums}
.gapc .pill{margin-left:.15rem}
.fld .gapc{margin-left:.35rem}
.chip.alt[aria-pressed="true"]{background:var(--label);color:var(--bg)}
.result .abbr.sm{margin-right:.25rem}

/* result team blocks */
.tblock summary{display:flex;align-items:center;gap:.75rem;min-height:3.5rem;padding:.6rem 1rem;cursor:pointer;list-style:none}
.tblock summary::-webkit-details-marker{display:none}
.tblock summary .nm{flex:1;min-width:0;font-weight:600}
.tblock summary .topp{display:block;font-size:.8125rem;font-weight:400;color:var(--label2)}
.tblock summary .chev{transform:rotate(135deg);transition:transform .2s;margin:0 .25rem 0 .5rem}
.tblock[open] summary .chev{transform:rotate(-45deg)}
.tblock[open] summary{border-bottom:.5px solid var(--sep)}
.tblock summary:focus-visible{outline:2px solid var(--tint);outline-offset:-2px;border-radius:1.375rem}
.rrow.off .who b{color:var(--label2);font-weight:500}
.legend .pill{margin:0 .1rem 0 .35rem}.legend .pill:first-child{margin-left:0}
/* bet blocks */
.glist{display:flex;flex-direction:column}
.bet{display:flex;flex-direction:column;gap:.35rem;width:100%;padding:.75rem 1rem;position:relative;text-align:left;transition:background .15s}
.bet:active{background:var(--fill)}
.glist > * + .betw::before,.glist > .betw + .row::before{content:"";position:absolute;left:1rem;right:0;top:0;height:.5px;background:var(--sep)}
.bt-top{display:flex;align-items:flex-start;justify-content:space-between;gap:.75rem}
.bt-top b{font-weight:600;overflow-wrap:anywhere}
.bt-top .pill{margin:0;flex:none}
.bt-mid{display:flex;align-items:center;gap:.5rem;font-size:.875rem;color:var(--label2)}
.bt-row{display:flex;justify-content:space-between;gap:.75rem;font-size:.8125rem;color:var(--label2)}
.bviz{display:flex;flex-direction:column;gap:.5rem;margin:.15rem 0 .1rem}
.bv-keys{display:flex;gap:1rem;font-size:.75rem;color:var(--label2);flex-wrap:wrap}
.bk{display:inline-flex;align-items:center;gap:.35rem}
.bk b{font-size:.9375rem;font-weight:700;color:var(--label)}
.bk i{width:.5rem;height:.5rem;border-radius:50%;flex:none}
.bk.kl i{width:2px;height:.75rem;border-radius:1px;background:var(--label)}
.bk.kp i{box-shadow:inset 0 0 0 2px var(--tint)}
.bk.ks i{background:var(--label2)}
.bk.ks.pos i{background:var(--pos)}.bk.ks.neg i{background:var(--red)}
.bk.ks.pos b{color:var(--pos)}.bk.ks.neg b{color:var(--red)}
.bv-track{position:relative;display:block;height:.375rem;border-radius:999px;background:var(--fill);margin:.3rem 0}
.bv-seg{position:absolute;top:0;bottom:0;border-radius:999px;background:var(--label2);opacity:.35}
.bv-seg.pos{background:var(--pos)}.bv-seg.neg{background:var(--red)}
.bv-line{position:absolute;top:-.3rem;bottom:-.3rem;width:2px;margin-left:-1px;border-radius:1px;background:var(--label)}
.bv-proj,.bv-act{position:absolute;top:50%;width:.75rem;height:.75rem;margin:-.375rem 0 0 -.375rem;border-radius:50%}
.bv-proj{background:var(--card);box-shadow:inset 0 0 0 2.5px var(--tint)}
.bv-act{background:var(--label2);box-shadow:0 0 0 2px var(--card)}
.bv-act.pos{background:var(--pos)}.bv-act.neg{background:var(--red)}
.bv-cap{font-size:.75rem;font-weight:600;color:var(--label2)}
.bv-cap.pos{color:var(--pos)}.bv-cap.neg{color:var(--red)}
/* game switcher in the top bar */
.gpick{pointer-events:auto;flex:1 1 auto;min-width:0;max-width:15rem;margin:0 auto;height:2.75rem;padding:0 .75rem 0 1rem;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:.4rem;font-weight:600;color:var(--label);
  background:var(--lg-tint);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  box-shadow:inset .5px .5px 0 0 var(--lg-rim),inset -.5px -.5px 0 0 var(--lg-rim2),inset 0 0 0 .5px var(--lg-edge2),0 4px 14px var(--lg-sh);transition:transform .15s}
.gpick:active{transform:scale(.97)}
.gpick > span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gpick > span i{font-style:normal;font-weight:400;color:var(--label2)}
.gpick .ic{width:1.1rem;height:1.1rem;flex:none;color:var(--label2)}
.row.gp{min-height:3.25rem}
.row.gp + .row.gp::before{left:1rem}
.gp-t{flex:1;display:flex;align-items:center;gap:.45rem;min-width:0}
.gp-t b{font-weight:600}
.gp-t .at{font-size:.8125rem;color:var(--label2);margin:0 .15rem}
.gp-r{flex:none;font-size:.875rem;color:var(--label2);font-weight:600}
.row.gp.on{background:var(--tint-bg,var(--fill))}
.gp-ck{flex:none;width:.45rem;height:.8rem;border-right:2px solid var(--tint);border-bottom:2px solid var(--tint);transform:rotate(45deg);margin:-.2rem .2rem 0 .1rem}
/* calendar */
.chip.cal{display:inline-flex;align-items:center;gap:.35rem;padding:0 .7rem}
.chip.cal .ic{width:1.15rem;height:1.15rem}
.chip.cal::after{inset:-.25rem -.2rem}
.calc{padding:.75rem .75rem 1rem}
.cal-h{display:flex;align-items:center;justify-content:space-between;padding:0 .1rem .5rem}
.cal-h b{font-size:1.0625rem;font-weight:600}
.cal-h .glassbtn{box-shadow:none;background:var(--fill);-webkit-backdrop-filter:none;backdrop-filter:none}
.cal-h .glassbtn.fwd .ic{transform:scaleX(-1)}
.cal-h .glassbtn:disabled{opacity:.3}
.cal-w,.cal-g{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.cal-w span{font-size:.6875rem;font-weight:600;color:var(--label2);padding:.25rem 0}
.cal-g{row-gap:.25rem}
.cd{position:relative;height:2.75rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;font:600 1.0625rem var(--round);border-radius:999px;margin:0 auto;width:2.75rem}
.cd.off{color:var(--label2);opacity:.45;font-weight:400}
.cd.today{color:var(--tint)}
.cd i{width:.3rem;height:.3rem;border-radius:50%;background:var(--tint)}
button.cd:active{background:var(--fill)}
.cd.on{background:var(--tint);color:var(--on-tint)}
.cd.on i{background:var(--on-tint)}
.bt-row > span:last-child{font-weight:700;color:var(--label);text-align:right}
.bt-row > span.pos{color:var(--pos)}.bt-row > span.neg{color:var(--red)}
.tot{display:grid;grid-template-columns:repeat(auto-fit,minmax(5.5rem,1fr));gap:.5rem;padding:.75rem 1rem;background:var(--fill)}
.tot > span{display:flex;flex-direction:column;gap:.1rem;min-width:0}
.tot b{font-size:1.0625rem;font-weight:700}

/* bets */
.pos{color:var(--pos)}.neg{color:var(--red)}.tintc{color:var(--tint);font-weight:600}
.sum{display:grid;grid-template-columns:1fr 1fr;width:100%;transition:background .15s}
button.sum:active{background:var(--fill)}
.tile{display:flex;flex-direction:column;gap:.1rem;padding:.8rem 1rem;min-width:0}
.tile:nth-child(odd){border-right:.5px solid var(--sep)}.tile:nth-child(-n+2){border-bottom:.5px solid var(--sep)}
.tk{font-size:.75rem;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.04em}
.tv{font-size:1.5rem;font-weight:700;line-height:1.2}
.ts{font-size:.8125rem;color:var(--label2)}
.chips{display:flex;gap:.5rem;overflow-x:auto;scrollbar-width:none;margin:0 -1rem;padding:.25rem 1rem}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;position:relative;min-height:2.25rem;padding:0 .9rem;border-radius:999px;background:var(--fill);font-size:.875rem;font-weight:600;color:var(--label2);white-space:nowrap}
.chip::after{content:"";position:absolute;inset:-.25rem 0}
.chip[aria-pressed="true"]{background:var(--tint);color:var(--on-tint)}
.row.nork + .row.nork::before,.row.nork::before{left:1rem}
.row .pl{flex:none;font-weight:700;text-align:right}
.pill.w{background:var(--pos-bg);color:var(--pos)}.pill.y{background:var(--yel-bg);color:var(--yel)}.pill.or{background:var(--org-bg);color:var(--org)}.pill.l{background:var(--red-bg);color:var(--red)}.pill.v{background:var(--fill);color:var(--label2)}.pill.op{background:var(--attn-bg);color:var(--attn)}
.fld{display:flex;align-items:center;gap:.75rem;min-height:3rem;padding:0 1rem}
.fld + .fld{border-top:.5px solid var(--sep)}
.fld span{flex:1}
.fld input{flex:none;width:7.5rem;font:inherit;font-size:1.0625rem;text-align:right;color:var(--label);background:none;border:0;border-radius:.5rem;padding:.5rem .25rem;font-variant-numeric:tabular-nums}
.fld input:focus-visible,.ta:focus-visible{outline:2px solid var(--tint);outline-offset:1px}
.fld input::placeholder{color:var(--label2);opacity:.7}
.ta{width:100%;min-height:8rem;font:1rem/1.4 var(--font);border:0;border-radius:1rem;padding:.75rem;background:var(--inset);color:var(--label);resize:none}
.btn2.danger{color:var(--red);background:var(--red-bg)}
.result.small b{font-size:2rem}
.sheet .note{padding:0 .25rem}

/* weather-style blocks */
.sblock{position:relative;display:flex;flex-direction:column;background:var(--card);border-radius:1.375rem;box-shadow:0 0 0 .5px var(--sep);will-change:clip-path,opacity}
.sblock > .sb-h{position:relative;z-index:2;margin:0;padding:.8rem 1rem .45rem;background:var(--card);border-radius:1.375rem 1.375rem 0 0;will-change:transform}
.sblock > .card{background:none;box-shadow:none;border-radius:0}
.sblock > .card + .card{border-top:.5px solid var(--sep)}
.sblock > .hs{margin:0;padding:.25rem 1rem 1rem;scroll-padding-inline:1rem}
.sblock > .hs::after{content:"";flex:none;width:.25rem}
.sblock > .sum{border-top:.5px solid var(--sep)}
.sblock .tot{border-top:.5px solid var(--sep)}
details.sblock > summary.sb-h{border-radius:1.375rem;background:var(--card)}
details.sblock[open] > summary.sb-h{border-radius:1.375rem 1.375rem 0 0}
.sheet .sblock{box-shadow:none}

/* billy */
.billy{display:inline-block;line-height:0}
.billy svg{width:100%;height:100%;overflow:visible}
.billy .b-eyeR,.billy .b-sadeyes,.billy .b-sadbrows,.billy .b-frown{opacity:0}
.billy .b-earL{transform-origin:96px 124px}.billy .b-earR{transform-origin:160px 124px}
.billy .b-jaw,.billy .b-muz{transform-origin:128px 176px}
.billy.sad .b-eyeL,.billy.sad .b-wink,.billy.sad .b-brows,.billy.sad .b-smile{opacity:0}
.billy.sad .b-sadeyes,.billy.sad .b-sadbrows,.billy.sad .b-frown{opacity:1}
.billy.sad .b-earL{transform:rotate(-26deg)}.billy.sad .b-earR{transform:rotate(26deg)}
.billy.hello .b-wink{opacity:0;animation:bWinkOn 1.5s steps(1) both}
.billy.hello .b-eyeR{opacity:1;animation:bWinkOff 1.5s steps(1) both}
.billy.peek .b-wink{animation:bBlink 6s steps(1) infinite}
.billy.peek .b-eyeR{animation:bBlinkR 6s steps(1) infinite}
.billy.chew .b-jaw,.billy.chew .b-muz{animation:bChew .9s ease-in-out infinite}
.billy.jump{animation:bJump .9s cubic-bezier(.3,1.4,.5,1) 2}
.billy.sad{animation:bSigh 1.6s ease-in-out}
@keyframes bWinkOn{0%{opacity:0}60%{opacity:1}}
@keyframes bWinkOff{0%{opacity:1}60%{opacity:0}}
@keyframes bBlink{0%{opacity:1}88%{opacity:0}94%{opacity:1}}
@keyframes bBlinkR{0%{opacity:0}88%{opacity:1}94%{opacity:0}}
@keyframes bChew{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(3px) rotate(-2deg)}}
@keyframes bJump{0%,100%{transform:translateY(0) scale(1)}15%{transform:translateY(2px) scale(1.04,.94)}45%{transform:translateY(-22px) scale(.97,1.05)}75%{transform:translateY(0) scale(1.03,.97)}}
@keyframes bSigh{0%,100%{transform:translateY(0)}40%{transform:translateY(4px) rotate(-3deg)}70%{transform:translateY(3px) rotate(2deg)}}
#billy-hi{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.75rem;background-color:var(--bg);background-image:var(--glow);transition:opacity .4s ease}
#billy-hi .billy{width:8.5rem;height:10.5rem;animation:bPop .7s cubic-bezier(.3,1.5,.5,1) both}
#billy-hi b{font-size:1.25rem;font-weight:700;color:var(--tint);animation:fade .5s .35s both}
#billy-hi.out{opacity:0;pointer-events:none}
@keyframes bPop{0%{transform:translateY(24px) scale(.6);opacity:0}100%{transform:none;opacity:1}}
.pc{position:relative;overflow:hidden}
.pc .billy.peek{position:absolute;right:-.35rem;top:-.4rem;width:2.6rem;height:3.2rem;transform:rotate(14deg);animation:bPeek .8s .6s cubic-bezier(.3,1.4,.5,1) both;pointer-events:none}
@keyframes bPeek{0%{transform:translate(1.5rem,-1.5rem) rotate(40deg)}100%{transform:rotate(14deg)}}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.35rem;padding:1.5rem 1rem;border-radius:1.375rem;background:var(--card);box-shadow:0 0 0 .5px var(--sep)}
.empty .billy{width:5.5rem;height:6.75rem;margin-bottom:.25rem}
.empty b{font-size:1.0625rem}.empty span{font-size:.875rem;color:var(--label2);max-width:18rem}
#billy-react{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;padding:0 1rem calc(6.5rem + env(safe-area-inset-bottom));pointer-events:auto;animation:fade .25s both}
#billy-react.out{opacity:0;transition:opacity .3s}
.br-card{display:flex;align-items:center;gap:.9rem;padding:.75rem 1.25rem .75rem .75rem;border-radius:1.5rem;background:var(--lg-tint);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:inset 0 0 0 .5px var(--lg-edge2),0 10px 30px var(--lg-sh);animation:rise .45s cubic-bezier(.3,1.3,.5,1) both}
.br-card .billy{width:3.75rem;height:4.6rem}
.br-card span{display:flex;flex-direction:column;font-size:.875rem;color:var(--label2)}
.br-card b{font-size:1.25rem;color:var(--label)}
#billy-react.won .br-card b{color:var(--pos)}#billy-react.lost .br-card b{color:var(--red)}
.conf{position:absolute;inset:0;overflow:hidden;pointer-events:none}

  for(const b of list){ s.pl+=betPL(b); s[b.status]++; if(b.status==='open') s.openStake+=b.stake; else if(b.status!=='void') s.staked+=b.stake; }
  s.settled=s.won+s.lost; s.green=s.settled?s.won/s.settled*100:null; s.roi=s.staked?s.pl/s.staked*100:null;
  return s;
}

/* Nations League: same model, teams rated within their group. The table is built from the results. */
function unlPrep(s){
  const T={}, G={}; const row=t=>T[t]||(T[t]={h:[0,0,0],a:[0,0,0]});
  // one blowout (7-0) says less than it seems, so goals in a match count up to 4 when rating teams
  (s.results||[]).forEach(([g,h,a,hg,ag])=>{ G[h]=G[a]=g; hg=Math.min(hg,4); ag=Math.min(ag,4); const H=row(h),A=row(a); H.h[0]++;H.h[1]+=hg;H.h[2]+=ag; A.a[0]++;A.a[1]+=ag;A.a[2]+=hg; });
  s.table=T; s.groupOf=G; Object.values(s.teams).forEach(x=>{ if(!x.out) x.out=[]; }); return s;
}

function fbStatus(s,g,t,r){
  const [name,pos,m,goals,ast,type,info,ret]=r, id=(s.sid||'epl')+':'+s.date+':'+t+':'+name, day=g.utc.slice(0,10);
  let a,label,cls;
  if(ret==='x'){a=0;label='Out';cls='o'}
  else if(type==='S'){ if(!ret||ret>=day){a=0;label='Suspended';cls='o'} else {a=1;label='Ban served';cls='v'} }
  else if(!ret){a=.5;label='Doubtful';cls='q'}
  else if(ret>day){a=0;label=ret>new Date(Date.parse(day)+21*864e5).toISOString().slice(0,10)?'Out long term':'Out';cls='o'}
  else {a=.8;label='Expected back';cls='v'}
  const ed=id in edits.play; if(ed) a=edits.play[id]?1:0;
  return {id,name,pos,m,goals,ast,type,info,ret,a,label,cls,edited:ed};
}
function fbAbsent(s,g,t){ return (s.teams[t].out||[]).map(r=>fbStatus(s,g,t,r)); }
const DEF_W={G:[.10,.04],D:[.05,.02],M:[.02,0],F:[0,0]};
function fbInjury(s,g,t){
  const tb=s.table[t], gf=tb.h[1]+tb.a[1], list=fbAbsent(s,g,t);
  let lost=0,def=0; const who=[];
  list.forEach(p=>{ const miss=1-p.a; if(miss<=0) return;
    const c=p.goals+.5*p.ast; if(c>0){ lost+=miss*c; who.push(p.name.split(' ').slice(-1)[0]); }
    const w=DEF_W[p.pos]||[0,0], d=p.m>=6?w[0]:p.m>=3?w[1]:0; def+=miss*d; });
  const share=gf?lost/gf:0;
  return {att:Math.max(.7,1-FB.LOST*share),def:Math.min(1.25,1+def),share,lost,who,list};
}
function fbLeague(s,grp){
  const avg=list=>{ let hp=0,hg=0,ap=0,ag=0; list.forEach(x=>{hp+=x.h[0];hg+=x.h[1];ap+=x.a[0];ag+=x.a[1];}); return {home:hg/hp,away:ag/ap,team:(hg+ag)/(hp+ap)}; };
  const all=avg(Object.values(s.table)); if(!grp) return all;
  const g=avg(Object.entries(s.table).filter(([t])=>s.groupOf[t]===grp).map(([,x])=>x));
  return {home:(g.home+all.home)/2,away:(g.away+all.away)/2,team:(g.team+all.team)/2,group:grp};
}
const shrink=(raw,n)=>(n*raw+FB.SHRINK)/(n+FB.SHRINK);
function fbStrength(s,t,venue,L){
  const x=s.table[t], n=x.h[0]+x.a[0], v=x[venue][0]?x[venue]:[n,x.h[1]+x.a[1],x.h[2]+x.a[2]], vAvg=venue==='h'?L.home:L.away, oAvg=venue==='h'?L.away:L.home;
  const att=shrink(((v[1]/v[0])/vAvg+((x.h[1]+x.a[1])/n)/L.team)/2,n);
  const def=shrink(((v[2]/v[0])/oAvg+((x.h[2]+x.a[2])/n)/L.team)/2,n);
  return {att,def,gfv:v[1]/v[0],gav:v[2]/v[0]};
}
function fbCorners(s,g){
  const C=s.corners||{}, A=s.cornersAvg||{home:5,away:4.5}, all=(A.home+A.away)/2, n=s.cornersN||10;
  const one=(t,o,venue)=>{ const c=C[t]||{h:A.home,a:A.away,f:all,ag:all}, oc=C[o]||{ag:all}, vAvg=venue==='h'?A.home:A.away;
    const forS=shrink(((venue==='h'?c.h:c.a)/vAvg+c.f/all)/2,n), agS=oc.ag!=null?shrink(oc.ag/all,n):1;
    return {lam:vAvg*forS*agS,forS,agS,base:vAvg,won:venue==='h'?c.h:c.a,conc:oc.ag}; };
  if(!C[g.home]&&!C[g.away]) return null;
  return {home:one(g.home,g.away,'h'),away:one(g.away,g.home,'a')};
}
const _fbc={};
function fbModel(s,g){
  const L=fbLeague(s,g.group), H=fbStrength(s,g.home,'h',L), A=fbStrength(s,g.away,'a',L), iH=fbInjury(s,g,g.home), iA=fbInjury(s,g,g.away);
  const lh=L.home*H.att*A.def*iH.att*iA.def, la=L.away*A.att*H.def*iA.att*iH.def;
  const ph=pois(lh,10), pa=pois(la,10), grid=ph.map(x=>pa.map(y=>x*y));
  let hw=0,dr=0,aw=0,btts=0; grid.forEach((r,i)=>r.forEach((v,j)=>{ if(i>j)hw+=v; else if(i===j)dr+=v; else aw+=v; if(i>0&&j>0)btts+=v; }));
  const scores=[]; grid.forEach((r,i)=>r.forEach((v,j)=>scores.push({h:i,a:j,p:v}))); scores.sort((a,b)=>b.p-a.p);
  return {L,H,A,iH,iA,lh,la,ph,pa,grid,hw,dr,aw,btts,scores,corners:fbCorners(s,g)};
}
/* probability helpers */
function pois(l,max){ const r=[]; let p=Math.exp(-l); for(let k=0;k<=max;k++){ r.push(p); p*=l/(k+1); } return r; }
function negbin(mu,r,max){ const q=r/(r+mu), out=[]; let p=Math.pow(q,r); for(let k=0;k<=max;k++){ out.push(p); p*=(k+r)/(k+1)*(1-q); } return out; }
function overUnder(pmf,L){ let over=0,under=0,push=0; pmf.forEach((v,k)=>{ if(k>L)over+=v; else if(k<L)under+=v; else push+=v; }); const t=over+under+push||1; return {over:over/t,under:under/t,push:push/t}; }
/* one market as a distribution: goals or corners, the match or one team */
function fbDist(m,stat,market,side){
  if(stat==='corners'){ const c=m.corners, mu=market==='total'?c.home.lam+c.away.lam:c[side].lam; return {mu,pmf:negbin(mu,FB.CORNER_R,40)}; }
  const mu=market==='total'?m.lh+m.la:(side==='home'?m.lh:m.la); return {mu,pmf:pois(mu,15)};
}
const P0=v=>Math.round(v*100)+'%';

/* BET CALCULATOR: the chance a bet wins (from the projection), compared with the odds, and how much of your bank to stake.
   The stake uses the Kelly rule, scaled down (a quarter or half) and capped, because projections are never exact. */
let acct=DB.get('acct',{}); if(!acct||typeof acct!=='object') acct={};

/* NBA: how far real points land from the projection, measured on past days with results */
let _nbaC=null;
function nbaSpread(){
  if(_nbaC) return _nbaC; const sp=SPORTS.nba; let sum=0,n=0;
  (sp?sp.slates:[]).forEach(s=>{ if(!s.actual) return;
    const opp=t=>{const g=s.games.find(x=>x.away===t||x.home===t); return g?(g.away===t?g.home:g.away):null};
    Object.entries(s.teams).forEach(([t,tm])=>{ const o=opp(t), d=o&&s.defense&&s.defense[o];
      tm.players.forEach(([name,pos,min,pts,st])=>{ if(st==='O'||st==='D') return; const a=s.actual[t]&&s.actual[t][name]; if(a==null) return;
        const idx=(sp.groups[pos]||sp.groups.F).cols, avg=x=>idx.reduce((q,k)=>q+x[k],0)/idx.length, mu=d?avg(d)/avg(s.leagueDefense):1;
        const p=sp.project(min,pts,min,mu).result; if(p<3) return; sum+=(a-p)*(a-p)/p; n++; }); }); });
  _nbaC={c:n>20?Math.sqrt(sum/n):1.6,n}; return _nbaC;
}

/* chance the bet wins, loses or is a push (line hit exactly) */
function winChance(d){
  if(isScore(d)){ const s=SPORTS[d.sport].slates.find(x=>x.date===d.date), g=s&&s.games.find(x=>x.id===d.gid); if(!g) return null;
    const p=fbModel(s,g).grid[d.sh][d.sa]; return {p,push:0,q:1-p,how:'goal model, chance of this exact score'}; }
  const L=num(d.line); if(L==null) return null;
  if((SPORTS[d.sport]||{}).kind==='match'){
    const s=SPORTS[d.sport].slates.find(x=>x.date===d.date), g=s&&s.games.find(x=>x.id===d.gid); if(!g) return null;
    const m=fbModel(s,g), k=d.market==='total'?'':(d.team===g.home?'home':'away'), dist=fbDist(m,d.stat,d.market,k), ou=overUnder(dist.pmf,L);
    const w=d.side==='under'?ou.under:ou.over; return {p:w,push:ou.push,q:1-w-ou.push,mu:dist.mu,how:d.stat==='corners'?'corner model':'goal model'};
  }
  const mu=num(d.proj); if(mu==null||mu<=0) return null;
  const S=nbaSpread(), sd=Math.max(2.5,S.c*Math.sqrt(mu)), over=1-normCdf((L-mu)/sd), p=Math.min(.95,Math.max(.05,d.side==='under'?1-over:over));

  const w=winChance(d), o=num(d.odds); if(!w) return null;

  if(acct.bank>0&&r.k>0){ const f=Math.min(acct.cap,r.k*acct.frac); r.frac=f; r.stake=Math.max(.5,Math.floor(acct.bank*f*2)/2); }

}

/* bets */
const BSTAT={open:['op','Open'],won:['w','Won'],lost:['l','Lost'],void:['v','Void']};
function betLine(b){ return `${b.side==='under'?'Under':'Over'}${b.line!=null?' '+b.line:''} ${b.stat}`; }
/* what the player really scored in the game this bet is on: typed in Results, or loaded from the box score */
function betActual(b){
  const s=(SPORTS[b.sport]||SPORT).slates.find(x=>x.date===b.date); if(!s) return null;
  if(isScore(b)) return null;
  if((SPORTS[b.sport]||{}).kind==='match'){ const g=s.games.find(x=>x.id===b.gid), src=g&&(b.stat==='corners'?g.corners:g.final); if(!src) return null;
    return b.market==='total'?src.home+src.away:src[b.team===g.home?'home':'away']; }
  const id=b.sport+':'+b.date+':'+b.team+':'+b.player;
  if(id in acts) return acts[id];
  return s.actual&&s.actual[b.team]&&b.player in s.actual[b.team]?s.actual[b.team][b.player]:null;
}
function betViz(b,a){
  if(isScore(b)){ const f=scoreFinal(b), win=f?(f.home===b.sh&&f.away===b.sa):null, cls=win==null?'':win?'pos':'neg', K=(k,v,c)=>`<span class="bk ${c||''}">${k}<b class="num">${v}</b></span>`;
    return `<span class="bviz"><span class="bv-keys">${K('Pick',b.sh+'–'+b.sa)}${b.proj!=null?K('Chance',Math.round(b.proj*1000)/10+'%','kp'):''}${K('Final',f?f.home+'–'+f.away:'–','ks '+cls)}</span></span>`; }
  const L=b.line, P=b.proj, vals=[L,P,a].filter(v=>v!=null);
  if(L==null) return '';
  const lo=Math.max(0,Math.floor(Math.min(...vals)-4)), hi=Math.ceil(Math.max(...vals)+4), x=v=>((v-lo)/(hi-lo)*100).toFixed(1)+'%';
  const win=a==null?null:a===L?null:(a>L)===(b.side!=='under');
  const cls=win==null?'':win?'pos':'neg';
  const seg=a==null?'':`<span class="bv-seg ${cls}" style="left:${x(Math.min(a,L))};width:calc(${x(Math.max(a,L))} - ${x(Math.min(a,L))})"></span>`;
  const K=(k,v,c)=>`<span class="bk ${c||''}"><i></i>${k}<b class="num">${v}</b></span>`;
  return `<span class="bviz">
    <span class="bv-keys">${K('Line',L,'kl')}${P!=null?K('Proj',f1(P),'kp'):''}${K(b.stat==='corners'?'Count':'Scored',a!=null?a:'–','ks '+cls)}</span>
    <span class="bv-track" aria-hidden="true">${seg}<span class="bv-line" style="left:${x(L)}"></span>${P!=null?`<span class="bv-proj" style="left:${x(P)}"></span>`:''}${a!=null?`<span class="bv-act ${cls}" style="left:${x(a)}"></span>`:''}</span>
    ${a!=null?`<span class="bv-cap ${cls}">${a===L?'Exactly on the line':(Math.abs(a-L)%1?Math.abs(a-L).toFixed(1):Math.abs(a-L))+(a>L?' over':' under')+' the line'}</span>`:''}
  </span>`;
}
function betRow(b){
  const pl=betPL(b), st=BSTAT[b.status], ret=b.stake*b.odds, a=betActual(b);

/* totals for a group of bets: stake, what it pays back if every bet wins, and the profit in that case */
function totalsHTML(list,showPL){
  const st=list.reduce((s,b)=>s+b.stake,0), ret=list.reduce((s,b)=>s+b.stake*b.odds,0), s=betStats(list);
  const C=(k,v,cls)=>`<span><span class="tk">${k}</span><b class="num ${cls||''}">${v}</b></span>`;
  // all settled: just stake and P/L; anything still open: stake, return and profit if every open bet wins
  return s.open===0&&showPL?`<div class="tot">${C('Staked',money(st))}${C('P/L',signed(s.pl),s.pl>0.004?'pos':s.pl<-0.004?'neg':'')}</div>`
    :`<div class="tot">${C('Staked',money(st))}${C('Return',money(ret))}${C('Profit',money(ret-st))}</div>`;
}

/* football: the biggest goal and corner projections, ranked against the competition's usual numbers */
function fbTopCards(n,label){
  const gs=SLATE.games.filter(g=>!g.final), ms=gs.map(g=>({g,m:fbModel(SLATE,g)}));
  if(!ms.length) return [];
  const avg=f=>ms.reduce((q,x)=>q+f(x),0)/ms.length, G=x=>x.m.lh+x.m.la, C=x=>x.m.corners?x.m.corners.home.lam+x.m.corners.away.lam:0, ag=avg(G), ac=avg(C);
  const items=ms.flatMap(x=>[{x,stat:'goals',v:G(x),score:G(x)/ag},...(C(x)?[{x,stat:'corners',v:C(x),score:C(x)/ac}]:[])]);
  const used=new Set();
  return items.sort((a,b)=>b.score-a.score).filter(i=>{ const k=i.x.g.id+i.stat; if(used.has(k)) return false; used.add(k); return true; }).slice(0,n).map(({x,stat,v,score})=>{ const g=x.g;
    return {utc:g.utc,score,html:`<button class="pc fbpc" style="${tstyle(g.home)}" data-sport="${SPORT.id}" data-day="${DAY}" data-do="open" data-id="${g.id}" data-fb="${stat}" aria-label="${matchTitle(g)}, ${v.toFixed(1)} ${stat} expected">${label?`<span class="pcl">${SPORT.league}</span>`:''}<span class="pct">${tile(g.home,'sm')}${tile(g.away,'sm')}</span><b>${g.home} v ${g.away}</b><span class="pcv num">${v.toFixed(1)}</span><span class="pcs">${stat} expected · ${day(g.utc).split(' ')[0]} ${clock(g.utc)}</span></button>`}; });
}

const SH={W:390,PAD:16};
function shGame(b){
  const sp=SPORTS[b.sport]||SPORT, s=sp.slates.find(x=>x.date===b.date);
  const g=s&&s.games.find(x=>x.away===b.team||x.home===b.team);
  const F=(SPORTS[b.sport]||{}).kind==='match';
  return g?{away:g.away,home:g.home,utc:g.utc,final:g.final,label:F?`${g.home} v ${g.away}`:`${g.away} at ${g.home}`,fin:g.final?(F?`${g.final.home}–${g.final.away}`:`${g.final.away}–${g.final.home}`):''}:{away:b.team,home:b.opp,utc:b.when,label:`${b.team} v ${b.opp}`};
}
function shColors(sport,t){ const c=((SPORTS[sport]||SPORT).colors||{})[t]||['#8E8E93','#8E8E93']; return [c[0],c[1]||c[0]]; }
function rr(x,c,y,w,h,r){ c.beginPath(); c.roundRect?c.roundRect(x,y,w,h,r):c.rect(x,y,w,h); }
function shTile(c,sport,t,x,y,w,h){
  const [p,s]=shColors(sport,t), g=c.createLinearGradient(x,y,x+w,y+h);
  g.addColorStop(.3,p); g.addColorStop(1,s); c.fillStyle=g; rr(x,c,y,w,h,h*.3); c.fill();

  c.fillText(t,x+w/2,y+h/2+.5); c.textAlign='left'; c.textBaseline='alphabetic';
}
function shFit(c,txt,max){ if(c.measureText(txt).width<=max) return txt; while(txt.length>1&&c.measureText(txt+'…').width>max) txt=txt.slice(0,-1); return txt+'…'; }
const SH_ST={open:['Open','#7A5A00','#FEF0B8'],won:['Won','#1A7F37','#D6F3DD'],lost:['Lost','#C5221F','#FBDAD8'],void:['Void','#636366','#E5E5EA']};

async function makeShareImage(list,title,sub){

  const hb=c.createLinearGradient(0,0,W,headH); hb.addColorStop(0,'#731328'); hb.addColorStop(1,'#4A0C1A');

    const h=shCardH(b), x=P, w=W-P*2, a=betActual(b), g=shGame(b), st=SH_ST[b.status]||SH_ST.open;
    c.save(); c.shadowColor='rgba(60,20,30,.12)'; c.shadowBlur=14; c.shadowOffsetY=4; c.fillStyle='#fff'; rr(x,c,y,w,h,18); c.fill(); c.restore();
    shTile(c,b.sport,b.team,x+14,y+14,46,32);

    c.font=F(700,12); const pw=c.measureText(st[0]).width+18;
    c.fillStyle=st[2]; rr(x+w-14-pw,c,y+16,pw,22,11); c.fill(); c.fillStyle=st[1]; c.fillText(st[0],x+w-14-pw+9,y+31);
    c.fillStyle='#1C1C1E'; c.font=F(700,17); c.fillText(shFit(c,b.player,w-74-pw-24),x+70,y+30);
    const when=g.final?`Final ${g.fin}`:`${day(g.utc)} · ${clock(g.utc)}`;
    c.fillStyle='#6C6C70'; c.font=F(500,12.5); c.fillText(shFit(c,`${g.label} · ${when}`,w-74-pw-24),x+70,y+47);
    // three boxes: pick, odds, projection
    const bx=isScore(b)?[['Score',`${b.sh}–${b.sa}`,'#731328'],['Odds',b.odds.toFixed(2),'#1C1C1E'],['Chance',Math.round(b.proj*100)+'%','#1C1C1E']]:[[`${b.side==='under'?'Under':'Over'} ${b.stat}`,b.line!=null?String(b.line):'–','#731328'],['Odds',b.odds.toFixed(2),'#1C1C1E'],['Projected',b.proj!=null?f1(b.proj):'–','#1C1C1E']];
    const gap=8, bw=(w-28-gap*2)/3;
    bx.forEach(([k,v,col],i)=>{ const X=x+14+i*(bw+gap), Y=y+62;
      c.fillStyle=i===0?'#F9EDEF':'#F2F2F7'; rr(X,c,Y,bw,54,12); c.fill();
      c.fillStyle='#6C6C70'; c.font=F(600,10.5); c.fillText(shFit(c,k.toUpperCase(),bw-20),X+10,Y+19);
      c.fillStyle=col; c.font=F(800,21); c.fillText(v,X+10,Y+44); });
    if(a!=null){ const win=b.line==null||a===b.line?null:(a>b.line)===(b.side!=='under');
      c.fillStyle=win==null?'#6C6C70':win?'#1A7F37':'#C5221F'; c.font=F(700,12.5);
      const d=b.line==null?'':` · ${Math.abs(a-b.line)%1?Math.abs(a-b.line).toFixed(1):Math.abs(a-b.line)} ${a>=b.line?'over':'under'} the line`;

}
async function openShare(list,title,sub,name){

/* WEATHER-STYLE BLOCKS
   A section title and the cards after it become one block. While you scroll, the title stays pinned under the
   top bar, the block's content slides up underneath it and is cut off there, and when the block runs out the
   title rides up with it and the block fades. Team blocks in Results (details) work the same way. */
function blockify(root){
  [...root.children].forEach(el=>{
    if(!el.classList||!el.classList.contains('sec')||!el.parentNode) return;
    const parts=[]; let n=el.nextElementSibling;
    while(n&&n.matches('.card,.hs')){ parts.push(n); n=n.nextElementSibling; }
    if(!parts.length) return;
    const s=document.createElement('section'); s.className='sblock';
    el.parentNode.insertBefore(s,el); el.classList.add('sb-h'); s.appendChild(el); parts.forEach(p=>s.appendChild(p));
  });
  root.querySelectorAll('details.tblock').forEach(d=>{ d.classList.add('sblock'); const sm=d.querySelector('summary'); if(sm) sm.classList.add('sb-h'); });
}
let blkRaf=0;
function paintBlocks(){
  blkRaf=0;
  const row=navEl.querySelector('.nav-row'); if(!row) return;
  const line=row.getBoundingClientRect().bottom+4;
  view.querySelectorAll('.sblock').forEach(b=>{
    const h=b.querySelector(':scope > .sb-h'); if(!h) return;
    const r=b.getBoundingClientRect(), hh=h.offsetHeight, d=line-r.top;
    if(d<=0||r.bottom<0){ if(b.dataset.on){ b.style.clipPath=''; b.style.opacity=''; h.style.transform=''; delete b.dataset.on; } return; }
    const shift=Math.max(0,Math.min(d,r.height-hh)), left=r.bottom-line, fadeZone=hh*1.6;
    b.dataset.on='1';
    h.style.transform=`translateY(${shift}px)`;
    b.style.clipPath=`inset(${Math.max(0,d)}px 0 0 0 round 1.375rem)`;
    b.style.opacity=left<fadeZone?Math.max(0,left/fadeZone).toFixed(3):'';
  });
}
const queueBlocks=()=>{ if(!blkRaf) blkRaf=requestAnimationFrame(paintBlocks); };
addEventListener('scroll',queueBlocks,{passive:true});
addEventListener('resize',queueBlocks);
document.addEventListener('toggle',queueBlocks,true);

/* page slide */
function pgSnap(){
  const c=view.cloneNode(true); c.removeAttribute('id'); c.querySelectorAll('[id]').forEach(e=>e.removeAttribute('id'));
  c.className='view pg'; c.setAttribute('aria-hidden','true'); c.inert=true; c.style.top=(-scrollY)+'px';

}
function pgRun(dir,snap){
  const a=dir==='fwd'?'pg-in':'pg-back-in'; view.classList.add(a); snap.classList.add(dir==='fwd'?'pg-under':'pg-out');
  pgUntil=Date.now()+480;
  setTimeout(()=>{snap.remove();view.classList.remove(a);document.documentElement.classList.remove('pg-run')},REDUCE()?160:480);
}

function bindDrag(el){
  let y0=null,dy=0,t0=0,h=0; const body=el.querySelector('.sh-body'), sc=root.querySelector('.scrim');
  el.addEventListener('touchstart',e=>{
    if(e.target.closest('input,textarea')||(e.target.closest('button')&&!e.target.closest('.sh-head'))){y0=null;return}
    if(body.contains(e.target)&&body.scrollTop>0){y0=null;return}
    y0=e.touches[0].clientY;dy=0;t0=Date.now();h=el.offsetHeight;el.style.animation='none';el.style.transition='none';
  },{passive:true});
  el.addEventListener('touchmove',e=>{
    if(y0==null) return; dy=e.touches[0].clientY-y0;
    el.style.transform=`translateY(${dy>0?dy:dy/6}px)`;
    const pr=Math.max(0,Math.min(1,dy/h));

    if(dy>0&&e.cancelable) e.preventDefault();

  el.addEventListener('touchend',()=>{
    if(y0==null) return; const v=dy/Math.max(1,Date.now()-t0); y0=null;

      sheet=null; releasePage(); if(sc){sc.style.transition='opacity .3s';sc.style.opacity=0}

      document.documentElement.style.removeProperty('--pscale'); if(sc) sc.style.opacity='';

}

function toast(msg,undoFn){
  undo=undoFn||null; toastEl.innerHTML=`<span>${esc(msg)}</span>${undo?'<button data-do="undo">Undo</button>':''}`;
  toastEl.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>toastEl.classList.remove('on'),4000);
}
function syncDraft(){ if(sheet&&sheet.kind==='bet') ['line','stake','odds'].forEach(k=>{const e=$('#bf-'+k); if(e) sheet.draft[k]=e.value}); }
function refresh(){ const y=scrollY; syncDraft(); renderAll(); scrollTo(0,y); if(sheet) renderSheet(); }
function backFromBet(){ if(sheet.from){ sheet={kind:'player',t:sheet.from.t,i:sheet.from.i}; refresh(); } else { closeSheet(); refresh(); } }
function editBet(b,from){
  const s={kind:'bet',id:b.id,from,draft:{...b,line:b.line==null?'':String(b.line),stake:String(b.stake),odds:String(b.odds)}};
  if(sheet){ sheet=s; renderSheet(); } else openSheet(s);
}
function newDraft(p){ return {sport:SPORT.id,date:SLATE.date,when:gameOf(p.t).utc,team:p.t,opp:p.opp,player:p.name,stat:SPORT.stat,proj:+p.result.toFixed(1),side:'over',line:'',stake:'',odds:'',status:'open'}; }
/* + and - on the bet form: the line moves by 0.5, the odds by 0.01. Hold to keep going. */
function betStep(f,dir){
  const e=$('#bf-'+f); if(!e||!sheet||sheet.kind!=='bet') return; let v=num(e.value);
  if(f==='line'){ v=v==null?Math.round(sheet.draft.proj*2)/2:Math.max(0,Math.round((v+dir*.5)*2)/2); e.value=String(v); }
  else { v=v==null?1.90:Math.max(1.01,Math.round((v+dir*.01)*100)/100); e.value=v.toFixed(2); }
  sheet.draft[f]=e.value; const h=$('#bhint'); if(h) h.innerHTML=betHint(sheet.draft);
}
let holdT=0, holdI=0; const stopHold=()=>{ clearTimeout(holdT); clearInterval(holdI); };
document.addEventListener('pointerdown',e=>{
  const b=e.target.closest('[data-do="bstep"]'); if(!b) return;
  stopHold(); betStep(b.dataset.f,+b.dataset.d);
  holdT=setTimeout(()=>{ holdI=setInterval(()=>betStep(b.dataset.f,+b.dataset.d),70); },450);
});
['pointerup','pointercancel','contextmenu'].forEach(t=>document.addEventListener(t,stopHold));
addEventListener('blur',stopHold);
/* events */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-do]'); if(!b) return; const d=b.dataset;
  const ctx=b.closest('[data-sport]'); if(ctx&&!root.contains(ctx)){ if(SPORT.id!==ctx.dataset.sport) setSport(ctx.dataset.sport); if(ctx.dataset.day!=null) setDay(+ctx.dataset.day); }
  switch(d.do){
    case 'tab':
      tapBar();
      if(d.tab===nav.tab&&!cur()){ scrollTo({top:0,behavior:REDUCE()?'auto':'smooth'}); break; }
      goTab(d.tab); break;
    case 'gotab': goTab(d.tab); break;
    case 'open': push({v:'game',s:SPORT.id,d:DAY,id:d.id,team:SLATE.games.find(g=>g.id===d.id).away,fb:d.fb==='corners'?'corners':undefined}); break;
    case 'league': setSport(d.s); push({v:'league',s:d.s,d:DAY}); break;
    case 'resleague': setSport(d.s); push({v:'res',s:d.s,d:DAY}); break;
    case 'list': push({v:'list',s:SPORT.id,d:DAY}); break;
    case 'hf': hf=d.v; DB.set('hf',hf); if(hf!=='all') setSport(hf); refresh(); break;
    case 'back': pop(); break;
    case 'team': cur().team=d.t; refresh(); break;
    case 'pos': topPos=d.p; refresh(); break;
    case 'day': setDay(+d.i); if(cur()) cur().d=DAY; resGame=null; refresh(); break;
    case 'cal': { const t=new Date(SLATE.games[0].utc); openSheet({kind:'cal',y:t.getFullYear(),m:t.getMonth()}); break; }
    case 'calm': { const t=new Date(sheet.y,sheet.m+(+d.d),1); sheet.y=t.getFullYear(); sheet.m=t.getMonth(); renderSheet(); break; }
    case 'calday': setDay(+d.i); if(cur()) cur().d=DAY; resGame=null; closeSheet(); refresh(); break;
    case 'sharebet': shareBets([d.id],'one'); break;
    case 'shareday': shareBets(d.ids.split(','),d.k); break;
    case 'sharego': shareGo(); break;
    case 'gamepick': openSheet({kind:'games'}); break;
    case 'gogame': { setDay(+d.i); const g=SLATE.games.find(x=>x.id===d.id); resGame=null; closeSheet();
      if(cur()) nav.stack[nav.stack.length-1]={v:'game',s:SPORT.id,d:DAY,id:g.id,team:g.away}; renderAll(); scrollTo(0,0); break; }
    case 'sport': setSport(d.s); topPos=''; pq=''; resGame=null; nav.stack=[]; if(sheet) closeSheet(); refresh(); break;
    case 'sportpick': openSheet({kind:'sports'}); break;
    case 'fbstat': fbStat=d.v; refresh(); break;
    case 'fbtab': cur().fb=d.v; refresh(); break;
    case 'fbscore': openSheet({kind:'bet',id:null,from:null,draft:fbScoreDraft(d.g,+d.h,+d.a)}); break;
    case 'fbbet': openSheet({kind:'bet',id:null,from:null,draft:fbDraft(d.g,d.stat,d.mk,d.k,+d.l,d.side)}); break;
    case 'fbplay': edits.play[d.id]=!(+d.a>=.5); DB.set('edits',edits); refresh(); break;
    case 'usestake': { const e=$('#bf-stake'); if(e){ e.value=d.v; sheet.draft.stake=d.v; } toast('Stake set to '+money(+d.v)); break; }
    case 'acfrac': acct.frac=+d.v; saveAcct(); refresh(); break;
    case 'accap': acct.cap=+d.v; saveAcct(); refresh(); break;
    case 'resgame': resGame=d.id; refresh(); break;
    case 'info': openSheet({kind:'info'}); break;
    case 'player': openSheet({kind:'player',t:d.t,i:+d.i}); break;
    case 'close': closeSheet(); break;
    case 'undo': if(undo){undo();undo=null;toastEl.classList.remove('on')} break;
    case 'resetall': { const old=JSON.parse(JSON.stringify(edits)); edits={min:{},play:{}}; DB.set('edits',edits); refresh();
      toast('Changes reset',()=>{edits=old;DB.set('edits',edits);refresh()}); break; }
    /* bets */
    case 'addbet': { if(!sheet||sheet.kind!=='player') break;
      sheet={kind:'bet',id:null,from:{t:sheet.t,i:sheet.i},draft:newDraft(player(sheet.t,sheet.i))}; renderSheet(); break; }
    case 'quickbet': openSheet({kind:'bet',id:null,from:null,draft:newDraft(player(d.t,+d.i))}); break;
    case 'bstep': if(e.detail===0) betStep(d.f,+d.d); break;   // keyboard only: touch and mouse are handled on press, below
    case 'bet': { const x=bets.find(q=>q.id===d.id); if(x) editBet(x,sheet&&sheet.kind==='player'?{t:sheet.t,i:sheet.i}:null); break; }
    case 'bside': syncDraft(); sheet.draft.side=d.v; renderSheet(); break;
    case 'bstatus': syncDraft(); sheet.draft.status=d.v; renderSheet(); break;
    case 'betcancel': backFromBet(); break;
    case 'betsave': { syncDraft(); const q=sheet.draft, stake=num(q.stake), odds=num(q.odds), hasLine=String(q.line).trim()!=='', line=hasLine?num(q.line):null;
      if(!(stake>0)||!(odds>1)){ toast('Enter a stake, and odds above 1.00'); break; }
      if(hasLine&&line==null){ toast('The line must be a number'); break; }
      const rec={id:sheet.id||('b'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)),sport:q.sport,date:q.date,when:q.when,team:q.team,opp:q.opp,player:q.player,stat:q.stat,proj:q.proj,gid:q.gid,market:q.market,sh:q.sh,sa:q.sa,side:q.side,line,stake,odds,status:q.status,ts:q.ts||Date.now()};
      const ix=bets.findIndex(x=>x.id===rec.id), was=ix>=0?bets[ix].status:null; if(ix>=0) bets[ix]=rec; else bets.push(rec); saveBets();
      backFromBet(); if(rec.status!==was&&(rec.status==='won'||rec.status==='lost')) billyReact(rec.status,betPL(rec)); else toast(ix>=0?'Bet updated':'Bet saved'); break; }
    case 'betdel': { const old=bets.slice(); bets=bets.filter(x=>x.id!==sheet.id); saveBets(); backFromBet();
      toast('Bet deleted',()=>{bets=old;saveBets();refresh()}); break; }
    case 'backup': openSheet({kind:'backup'}); break;
    case 'bkcopy': { const t=$('#bk').value; const ok=()=>toast('Copied'), no=()=>{ $('#bk').select(); toast('Select all the text and copy it'); };
      try{ navigator.clipboard.writeText(t).then(ok,no); }catch(err){ no(); } break; }
    case 'bkrestore': { let arr=null; try{ arr=JSON.parse($('#bk').value); }catch(err){}
      if(!Array.isArray(arr)||!arr.every(validBet)){ toast('That text is not a bets backup'); break; }
      const old=bets.slice(); bets=arr; saveBets(); closeSheet(); refresh();
      toast(`Restored ${arr.length} bet${arr.length===1?'':'s'}`,()=>{bets=old;saveBets();refresh()}); break; }
    default: if(sheet&&sheet.kind==='player'){
      const p=player(sheet.t,sheet.i);
      if(d.do==='min') edits.min[p.id]=Math.max(0,Math.min(48,Math.round(p.minutes+(+d.d))));
      if(d.do==='play') edits.play[p.id]=!p.playing;
      if(d.do==='reset'){delete edits.min[p.id];delete edits.play[p.id]}
      DB.set('edits',edits); refresh();
    }
  }
});
/* typed values: real points, moneyline odds, player search. Only the affected bits are redrawn so the keyboard stays up. */
document.addEventListener('toggle',e=>{ const d=e.target; if(d.classList&&d.classList.contains('tblock')) resOpen[d.dataset.key]=d.open; },true);
function paintGap(p){ document.querySelectorAll(`[data-gap="${p.t}-${p.i}"]`).forEach(e=>e.innerHTML=gapPill(p)||(e.closest('.rrow')?'<span class="pill v">No points yet</span>':'')); const a=$('#acc'); if(a) a.innerHTML=accHTML(); }
document.addEventListener('change',e=>{
  const el=e.target, d=el.dataset; if(!d||!d.in) return;
  if(d.in==='act'){
    const p=player(d.t,+d.i), v=el.value.trim();
    if(v==='') acts[p.id]=null; else { const x=num(v); if(x==null||x<0||x>200){ toast('Type the points as a number'); el.value=''; return; } acts[p.id]=x; }
    DB.set('acts',acts);
    if(sheet&&sheet.kind==='player'){ const y=scrollY; renderAll(); scrollTo(0,y); }
    paintGap(player(d.t,+d.i));
  }
  if(d.in==='bank'){ const v=el.value.trim(), x=num(v); if(v===''){acct.bank=null} else if(x==null||x<=0){ toast('Type the bank as a number'); el.value=''; return; } else { acct.bank=Math.round(x*100)/100; el.value=String(acct.bank); } saveAcct(); toast(acct.bank?'Bank set to '+money(acct.bank):'Bank cleared'); }
  if(d.in==='odds'){
    const g=SLATE.games.find(x=>x.id===d.g), k=oddsKey(g), v=el.value.trim(), cur=oddsEd[k]||{};
    if(v==='') cur[d.side]=null; else { const x=num(v); if(x==null||x<=1){ toast('Decimal odds must be above 1.00'); el.value=''; return; } cur[d.side]=x; el.value=x.toFixed(2); }
    oddsEd[k]=cur; DB.set('odds',oddsEd); const im=$('#imp'); if(im) im.textContent=impliedText(g);
  }
});
document.addEventListener('input',e=>{ const id=e.target.id||'';
  if(sheet&&sheet.kind==='bet'&&(id==='bf-line'||id==='bf-odds')){ sheet.draft[id.slice(3)]=e.target.value; const h=$('#bhint'); if(h) h.innerHTML=betHint(sheet.draft); }
  if(id==='psearch'){ pq=e.target.value; const l=$('#plist'); if(l) l.innerHTML=playerList(); } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&sheet) closeSheet(); if(e.key==='Enter'&&e.target.matches&&e.target.matches('input')) e.target.blur(); });
SPORT.load().then(()=>{ renderAll(); scrollTo(0,0); billyHello(); });
if('serviceWorker' in navigator && location.protocol==='https:'){ try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){} }

</script>
